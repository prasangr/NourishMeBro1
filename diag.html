<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nourish diagnostics</title>
<!-- TEMPORARY. Same origin as the app, so it reuses the session already signed
     in on this device and asks the server exactly what pull() asks. Delete once
     the empty-account puzzle is solved. -->
<style>
body{margin:0;padding:14px;background:#111;color:#eee;
  font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-word}
b{color:#EBC55B} .bad{color:#ff8a7a} .good{color:#8fdc8f}
pre{white-space:pre-wrap;margin:6px 0 14px}
</style>
<h3>Nourish diagnostics</h3>
<pre id="out">running…</pre>
<script type="module">
const out=document.getElementById("out");
const log=(s,cls="")=>out.innerHTML+=(cls?`<span class="${cls}">${s}</span>`:s)+"\n";
out.textContent="";
const URLB="https://cjwsaanaeruswbznjipg.supabase.co";
const KEYB="sb_publishable_b9W_cflXEF57T6BcLmYvqw_e9BoyG_l";
const back=n=>new Date(Date.now()-n*86400000).toLocaleDateString("en-CA");
try{
  log("<b>device</b>");
  log("  now        : "+new Date().toString());
  log("  today (app): "+new Date().toLocaleDateString("en-CA"));
  log("  back(400)  : "+back(400));
  log("  timezone   : "+(Intl.DateTimeFormat().resolvedOptions().timeZone||"?"));
  log("  UA         : "+navigator.userAgent);
  log("\n<b>localStorage</b>");
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i); const v=localStorage.getItem(k)||"";
    log(`  ${k} = ${v.length} chars`+(k.endsWith(".dirty")?` (${v})`:""));
  }
  const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const sb=createClient(URLB,KEYB);
  const {data:{session}}=await sb.auth.getSession();
  log("\n<b>session</b>");
  if(!session){ log("  NOT SIGNED IN on this origin","bad"); }
  else{
    log("  email : "+session.user.email);
    log("  uid   : "+session.user.id);
    const uid=session.user.id;
    const q=async(name,p)=>{ const r=await p;
      log(`  ${name}: ${r.error?("ERROR "+JSON.stringify(r.error)):((r.data?.length ?? (r.data?1:0))+" rows")}`,
          r.error?"bad":"good"); return r; };
    log("\n<b>the five queries pull() makes</b>");
    await q("profiles    ", sb.from("profiles").select("*").eq("user_id",uid).maybeSingle());
    await q("habits      ", sb.from("habits").select("*").eq("user_id",uid));
    await q("custom_foods", sb.from("custom_foods").select("*").eq("user_id",uid).order("created_at",{ascending:false}));
    const d=await q("day_logs    ", sb.from("day_logs").select("*").eq("user_id",uid).gte("day",back(400)));
    const m=await q("meal_entries", sb.from("meal_entries").select("*").eq("user_id",uid).gte("day",back(400)).order("created_at"));
    log("\n<b>same tables with no date filter</b>");
    await q("day_logs    ", sb.from("day_logs").select("*").eq("user_id",uid));
    await q("meal_entries", sb.from("meal_entries").select("*").eq("user_id",uid));
    if(d.data?.length) log("\n  first day row: "+JSON.stringify(d.data[0]));
    if(m.data?.length) log("  first meal row: "+JSON.stringify(m.data[0]));
  }
}catch(e){ log("\nTHREW: "+(e&&e.message||e),"bad"); }
</script>
