# Builds the Play upload (.aab) and a sideloadable .apk from android/.
# It runs here rather than on a laptop because GitHub's runners already have the
# Android SDK installed -- fetching it locally over a slow line costs an hour
# and buys nothing.
name: Android build

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own env: block is not in scope for its
    # if:, so the guard below would read an empty string and never restore the key.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      # No keystore secret (a fork, or before the key is uploaded) still builds,
      # just unsigned -- so a compile break is caught without needing the key.
      - name: Restore keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Show the fingerprint that assetlinks.json must match
        run: |
          f=$(find android -name "*.apk" | head -1)
          [ -n "$f" ] && unzip -p "$f" META-INF/*.RSA 2>/dev/null | keytool -printcert | grep SHA256 || true

      - uses: actions/upload-artifact@v4
        with:
          name: nourish-me-bro
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
