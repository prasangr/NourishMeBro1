  if((n=el("[data-hedit]"))){ const h=S.habits.find(x=>x.id===n.dataset.hedit); if(h) openAddHabit(h); return; }
  if(el('[data-act="add-habit"]')){ openAddHabit(); return; }
  if((n=el('[data-act="save-habit"]'))){ saveHabit(n.dataset.edit||null); return; }
  if((n=el('[data-act="del-habit"]'))){
    S.habits=S.habits.filter(h=>h.id!==n.dataset.id); save({unhabit:n.dataset.id}); closeSheet(); render(); toast("Habit removed"); return; }

  // The target sheet's own choices: highlight the tapped one, redo the sum.
  if((n=el("#t-job [data-job],#t-ex [data-ex],#t-sex [data-sex],#t-goal [data-goal]"))){
    Array.from(n.parentNode.children).forEach(b=>b.classList.toggle("on",b===n));
    refreshTarget(); return; }
  if(el('[data-act="save-target"]')){ saveTarget(); return; }
  if(el('[data-act="skip-target"]')){ skipTarget(); return; }
  if(el('[data-act="target"]')){ openTarget(); return; }
  if(el('[data-act="save-goals"]')){ saveGoals(); return; }
  if(el('[data-act="automacro"]')){ autoMacro(); return; }
  if(el('[data-act="save-water-goal"]')){ saveWaterGoal(); return; }
  if(el('[data-act="export"]')){ exportData(); return; }
  if(el('[data-act="import"]')){ openImport(); return; }
  if(el('[data-act="do-import"]')){ doImport(); return; }
  if(el('[data-act="reset"]')){
    const where = USER ? "in your account, on every device" : "on this device";
    if(confirm("Erase every log, habit and goal "+where+"? This cannot be undone.")){
      const wipeCloudToo=!!USER;
      try{ localStorage.removeItem(cacheKey()); }catch(err){}
      S=loadState();
      if(wipeCloudToo) push({wipe:true});
      render(); toast("Everything erased");
    } return; }
  if(el('[data-act="signout"]')){ signOut(); return; }
});

/* ============================ SETTINGS ============================ */
/* ---------- suggesting a calorie target ----------
   Mifflin-St Jeor for the resting burn, then two separate multipliers for what
   the day is actually made of. One "activity" dropdown makes a desk worker who
   trains five days a week choose which half of their life to lie about, so the
   job and the exercise are asked for separately and added. */
const JOBS=[
  {k:"sitting", l:"Sitting", s:"Desk, driving, studying", v:0},
  {k:"feet",    l:"On your feet a fair bit", s:"Teaching, shop floor, housework", v:.10},
  {k:"physical",l:"Physical work", s:"Labour, delivery, trades", v:.20}];
const EXERCISE=[
  {k:"rare", l:"Rarely",           v:0},
  {k:"1-2",  l:"1–2 days a week",  v:.08},
  {k:"3-4",  l:"3–4 days a week",  v:.16},
  {k:"5-6",  l:"5–6 days a week",  v:.24},
  {k:"daily",l:"Every day",        v:.32}];
const GOALS=[
  {k:"lose",     l:"Lose weight",  s:"about 0.5 kg a week", v:-500},
  {k:"maintain", l:"Stay the same", s:"hold your weight",   v:0},
  {k:"gain",     l:"Gain muscle",  s:"a slow build",        v:300}];
const pickOf=(arr,k)=>arr.find(x=>x.k===k)||arr[0];

function bmr(p){
  // Mifflin-St Jeor. Sex shifts the constant by 166 kcal, which is why it is asked.
  const base=10*p.weight+6.25*p.height-5*p.age;
  return p.sex==="f" ? base-161 : base+5;
}
function suggestTarget(p){
  const rest=bmr(p);
  const factor=1.2+pickOf(JOBS,p.job).v+pickOf(EXERCISE,p.exercise).v;
  const maintain=rest*factor;
  const target=maintain+pickOf(GOALS,p.goal).v;
  // A floor, whatever the arithmetic says. Below this it stops being a diet.
  const floor=p.sex==="f"?1200:1500;
  return {rest:round(rest), factor:+factor.toFixed(2),
    maintain:round(maintain), target:Math.max(floor,round(target)),
    floored:round(target)<floor};
}
function targetForm(){
  const p=S.profile;
  return `<p class="hint">Seven answers, once. We work out roughly what you burn
    in a day and suggest a calorie target — you can change it afterwards.</p>
  <div class="grid2">
    <div class="field"><label for="t-age">Age</label>
      <div class="inrow"><input id="t-age" type="number" inputmode="numeric" value="${p.age||""}" placeholder="28"><span class="unit">yrs</span></div></div>
    <div class="field"><label>Sex</label>
      <div class="seg" id="t-sex">
        <button type="button" data-sex="m" class="${p.sex==="f"?"":"on"}">Male</button>
        <button type="button" data-sex="f" class="${p.sex==="f"?"on":""}">Female</button>
      </div></div>
  </div>
  <div class="grid2">
    <div class="field"><label for="t-ht">Height</label>
      <div class="inrow"><input id="t-ht" type="number" inputmode="numeric" value="${p.height||""}" placeholder="175"><span class="unit">cm</span></div></div>
    <div class="field"><label for="t-wt">Weight</label>
      <div class="inrow"><input id="t-wt" type="number" inputmode="decimal" value="${p.weight||""}" placeholder="72"><span class="unit">kg</span></div></div>
  </div>
  <label class="flabel">Most of your day</label>
  <div class="stack" id="t-job" style="margin-bottom:16px">${JOBS.map(j=>
    `<button type="button" class="opt${(p.job||"sitting")===j.k?" on":""}" data-job="${j.k}">
      <b>${esc(j.l)}</b><span>${esc(j.s)}</span></button>`).join("")}</div>
  <label class="flabel">Exercise</label>
  <div class="seg wrap" id="t-ex" style="margin-bottom:16px">${EXERCISE.map(e=>
    `<button type="button" class="${(p.exercise||"rare")===e.k?"on":""}" data-ex="${e.k}">${esc(e.l)}</button>`).join("")}</div>
  <label class="flabel">What are you after</label>
  <div class="stack" id="t-goal" style="margin-bottom:16px">${GOALS.map(g=>
    `<button type="button" class="opt${(p.goal||"maintain")===g.k?" on":""}" data-goal="${g.k}">
      <b>${esc(g.l)}</b><span>${esc(g.s)}</span></button>`).join("")}</div>
  <div class="suggest" id="t-out"></div>
  <div class="stack">
    <button class="btn" data-act="save-target">Use this target</button>
    <button class="btn ghost" data-act="skip-target">Not now</button>
  </div>`;
}
// Reads the sheet, not the profile: the number moves as you change an answer.
function targetDraft(){
  const g=id=>Math.max(0,parseFloat($("#"+id).value)||0);
  const on=(sel,attr)=>{ const b=$(sel+" .on"); return b?b.dataset[attr]:""; };
  return {age:g("t-age"), height:g("t-ht"), weight:g("t-wt"),
    sex:on("#t-sex","sex")||"m", job:on("#t-job","job")||"sitting",
    exercise:on("#t-ex","ex")||"rare", goal:on("#t-goal","goal")||"maintain"};
}
function refreshTarget(){
  const d=targetDraft(), out=$("#t-out");
  if(!out) return;
  if(!d.age||!d.height||!d.weight){
    out.className="suggest waiting";
    out.innerHTML=`<span>Fill in age, height and weight to see a suggestion.</span>`;
    return;
  }
  const r=suggestTarget(d);
  out.className="suggest";
  out.innerHTML=`<div class="num big">${r.target}</div><div class="lbl">kcal a day</div>
    <p>You burn about <b>${r.maintain}</b> a day — ${r.rest} at rest, ×${r.factor} for how you
    live. ${r.goal==="maintain"?"":""}${
      pickOf(GOALS,d.goal).k==="lose"?`Eating ${r.target} takes off ${pickOf(GOALS,"lose").s}.`
      :pickOf(GOALS,d.goal).k==="gain"?"The extra 300 is what builds."
      :"That is what holds you steady."}${
      r.floored?" We stopped at the lowest we will suggest — eating less than this is not something to do without a doctor.":""}</p>`;
}
function openTarget(){
  openSheet("Set your target",targetForm(),true);
  refreshTarget();
  $("#sh-body").addEventListener("input",refreshTarget);
}
function saveTarget(){
  const d=targetDraft();
  if(!d.age||!d.height||!d.weight){ toast("Age, height and weight first"); return; }
  const r=suggestTarget(d), p=S.profile;
  Object.assign(p,d,{calGoal:r.target});
  // Same split the "Fill macros from calories" button uses.
  p.p=round(r.target*0.30/4); p.c=round(r.target*0.45/4);
  p.f=round(r.target*0.25/9); p.fib=round(r.target/1000*14);
  save({profile:true}); closeSheet(); render();
  toast("Target set — "+r.target+" kcal a day");
}
// Skipping still records the age, so the sheet does not ambush you every launch.
function skipTarget(){
  S.profile.age=S.profile.age||-1;
  save({profile:true}); closeSheet();
  toast("Keeping "+S.profile.calGoal+" kcal — change it any time in You");
}

function openWaterGoal(){
  const p=S.profile;
  openSheet("Water goal",
    `<div class="field"><label for="wg">Daily goal</label><div class="inrow"><input id="wg" type="number" inputmode="numeric" value="${p.waterGoal}"><span class="unit">ml</span></div></div>
    <div class="field"><label for="wgs">Your glass holds</label><div class="inrow"><input id="wgs" type="number" inputmode="numeric" value="${p.glass}"><span class="unit">ml</span></div></div>
    <button class="btn" data-act="save-water-goal">Save</button>`);
}
function saveWaterGoal(){
  S.profile.waterGoal=Math.max(200,parseInt($("#wg").value,10)||2500);
  S.profile.glass=Math.max(50,parseInt($("#wgs").value,10)||250);
  save({profile:true}); closeSheet(); render(); toast("Water goal saved");
}
function saveGoals(){
  const g=(id,d)=>Math.max(0,parseInt($("#"+id).value,10)||d), p=S.profile;
  p.name=$("#g-name").value.trim().slice(0,60);
  p.calGoal=g("g-cal",2000); p.p=g("g-p",120); p.c=g("g-c",220);
  p.f=g("g-f",60); p.fib=g("g-fib",30);
  p.waterGoal=g("g-water",2500); p.glass=g("g-glass",250);
  save({profile:true}); render(); toast("Profile saved");
}
function autoMacro(){
  // 30% protein, 45% carbs, 25% fat (4/4/9 kcal per gram); ~14g fibre per 1000 kcal
  const cal=Math.max(1,parseInt($("#g-cal").value,10)||S.profile.calGoal);
  $("#g-p").value=round(cal*0.30/4);
  $("#g-c").value=round(cal*0.45/4);
  $("#g-f").value=round(cal*0.25/9);
  $("#g-fib").value=round(cal/1000*14);
  toast("Macros filled in — check them, then save");
}

/* ============================ BACKUP ============================ */
function exportData(){
  const blob=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(blob).then(()=>toast("Backup copied to clipboard"),()=>showBackup(blob));
  } else showBackup(blob);
}
function showBackup(blob){
  openSheet("Your backup",
    `<p class="hint">Copy all of this, then paste it into Restore on your other device.</p>
    <textarea class="ta" readonly onclick="this.select()">${esc(blob)}</textarea>`);
}
function openImport(){
  openSheet("Restore from backup",
    `<p class="hint">Paste a backup below. This replaces what is on this device.</p>
    <textarea class="ta" id="imp" placeholder="Paste backup here"></textarea>
    <div style="height:12px"></div>
    <button class="btn" data-act="do-import">Restore</button>`);
}
function doImport(){
  const txt=($("#imp").value||"").trim();
  if(!txt){ toast("Paste a backup first"); return; }
  let obj;
  try{ obj=JSON.parse(txt); }catch(err){ toast("That is not a readable backup"); return; }
  if(!obj||typeof obj!=="object"||!obj.profile||!obj.days){ toast("That backup is missing data"); return; }
  S=Object.assign(loadState(),obj);
  S.days=S.days&&typeof S.days==="object"?S.days:{};
  S.habits=Array.isArray(S.habits)?S.habits:DEFAULT_HABITS.map(h=>Object.assign({},h));
  S.customFoods=Array.isArray(S.customFoods)?S.customFoods:[];
  save({bulk:true}); closeSheet(); render(); toast("Backup restored");
}

/* ============================ THEME ============================ */
function toggleTheme(){
  const root=document.documentElement;
  let cur=root.getAttribute("data-theme");
  if(!cur) cur=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  const next=cur==="dark"?"light":"dark";
  root.setAttribute("data-theme",next);
  const meta=document.querySelector('meta[name="theme-color"]:not([media])');
  if(meta) meta.content=next==="dark"?"#0E1113":"#E9ECEE";
  try{ localStorage.setItem("nourish.theme",next); }catch(e){}
}
(function initTheme(){
  try{ const t=localStorage.getItem("nourish.theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
})();

/* ============================ SELF-CHECK ============================ */
function devCheck(){
  const meals=[{cal:100,p:10,c:5,f:2,fib:1},{cal:250,p:5,c:30,f:8,fib:4}];
  const t=sumMeals(meals);
  console.assert(t.cal===350&&t.p===15&&t.c===35&&t.f===10&&t.fib===5,"sumMeals broken",t);
  console.assert(sumMeals([]).cal===0,"sumMeals of empty day should be 0");
  console.assert(sumMeals([{cal:50}]).p===0,"sumMeals must tolerate partial items");

  console.assert(clamp(5,0,1)===1&&clamp(-1,0,1)===0,"clamp broken");
  console.assert(pct(50,100)===50&&pct(200,100)===100&&pct(5,0)===0,"pct broken",pct(5,0));
  console.assert(streak("does-not-exist")===0,"streak of unknown habit should be 0");
  console.assert(esc('<img src=x onerror="a">')==="&lt;img src=x onerror=&quot;a&quot;&gt;","esc broken");

  // rail: under goal keeps the goal tick at the right edge, over goal pulls it in
  const under=rail([{meal:"lunch",cal:500,name:"x"}],2000);
  console.assert(under.indexOf("width:25%")>-1,"rail should scale to goal when under");
  console.assert(under.indexOf("left:calc(100% - 1px)")>-1,"goal tick sits at the end when under");
  const over=rail([{meal:"lunch",cal:3000,name:"x"}],2000);
  console.assert(over.indexOf("left:calc(66.66666666666666% - 1px)")>-1,"goal tick moves in when over",over);
  console.assert(rail([],2000).indexOf("rail-empty")>-1,"empty day shows the empty rail");

  // week rail: goal line placed from the bottom, no line when there is no goal
  const wk=weekChart([{d:"M",title:"x",segs:[{h:50,tone:"red"}]}],40);
  console.assert(wk.indexOf("bottom:40%")>-1,"week goal line missing",wk);
  console.assert(weekChart([{d:"M",title:"x",segs:[]}]).indexOf("wkgoal")===-1,
    "no goal line when no goal is passed");
  console.assert(calStrip(7).split("wkcol").length===8,"week rail must draw 7 days");
  console.assert(calStrip(70).split("wkcol").length===11,"long ranges must fold into weeks");

  // search: word order must not matter, and every word must land
  const am=FOODS.find(f=>f.n==="Aloo Matar");
  console.assert(hits(am,"matar aloo")&&hits(am,"aloo matar")&&hits(am,"ALOO"),"search word order broken");
  console.assert(!hits(am,"aloo gobi"),"search must require every word");
  console.assert(hits(am,"  "),"blank search shows everything");
  const av=FOODS.find(f=>f.n==="Avocado Toast");
  console.assert(hits(av,"avacardo")&&hits(av,"avacado"),"misspellings must still land",av);
  console.assert(FOODS.some(f=>hits(f,"brinjal"))&&FOODS.some(f=>hits(f,"okra")),
    "regional names must resolve");
  console.assert(hits(am,"matar alloo"),"doubled letters must still land");
  const be=FOODS.find(f=>f.n==="Boiled Egg Sandwich");
  console.assert(hits(be,"boilled egg sandwhich"),"typo run must still land",be);

  // habits: the stepper walks back but never past today
  const keep=habitDate;
  habitDate=todayStr();
  console.assert(viewHabits().indexOf('data-hday="1" aria-label="Next day" disabled')>-1,
    "forward step must be dead on today");
  console.assert(dayLabel(todayStr())==="Today","today must say Today");
  habitDate=keep;

  // foods list: capped, ordered, and every row carries a usable index
  const {all,of}=foodIndex();
  console.assert(of.get(all[5])===5,"food index must map back to its position");
  const q0=foodQuery, c0=foodCat; foodQuery=""; foodCat="All";
  const html=foodResults();
  console.assert((html.match(/class="pick"/g)||[]).length<=CAP+8,
    "unfiltered list must stay capped",(html.match(/class="pick"/g)||[]).length);
  console.assert(html.indexOf('data-food="undefined"')===-1,"every row needs an index");
  foodQuery=q0; foodCat=c0;
  console.assert(catRank("Dal & Legumes")<catRank("Soups"),"chip order must be eating order");

  // target: Mifflin-St Jeor against two worked examples, then the rails
  const man={age:28,sex:"m",height:175,weight:72,job:"sitting",exercise:"3-4",goal:"maintain"};
  console.assert(bmr(man)===1678.75,"BMR (male) wrong",bmr(man));
  const woman=Object.assign({},man,{sex:"f"});
  console.assert(bmr(woman)===1512.75,"BMR (female) wrong",bmr(woman));
  console.assert(suggestTarget(man).factor===1.36,"desk job plus 3-4 days must be 1.36",
    suggestTarget(man).factor);
  console.assert(suggestTarget(Object.assign({},man,{job:"physical",exercise:"daily"})).factor===1.72,
    "the top of the range must still be reachable");
  console.assert(suggestTarget(Object.assign({},man,{goal:"lose"})).target
    ===suggestTarget(man).target-500,"losing must take off 500");
  const tiny=suggestTarget({age:70,sex:"f",height:145,weight:40,job:"sitting",exercise:"rare",goal:"lose"});
  console.assert(tiny.target===1200&&tiny.floored,"the floor must hold",tiny);

  // every food row has the five numbers the app relies on
  const bad=FOODS.filter(f=>!f.n||!f.cat||[f.cal,f.p,f.c,f.f,f.fib].some(v=>typeof v!=="number"));
  console.assert(bad.length===0,"food entries missing numbers",bad);
  console.assert(FOODS.length>250,"food list unexpectedly small",FOODS.length);

  // ---- typing a whole meal ----
  // Commas are meant to be a convenience, so both spellings must read the same.
  const pl=q=>parseLine(q).rows.filter(r=>r.food);
  const withC=pl("2 roti, dal, chawal"), noC=pl("2 roti dal chawal");
  console.assert(withC.length===3,"a comma line should read 3 dishes",withC.map(r=>r.food.n));
  console.assert(noC.every(r=>r.food),"a comma-less line must resolve every word",noC);
  /* The two spellings do not have to agree row for row: with no separators the
     walk takes the longest real dish name it can find, so "dal chawal" lands on
     the plate of that name instead of splitting into dal and rice. Different
     rows, near enough the same day -- that is the property worth holding. */
  const kcal=rs=>rs.reduce((a,r)=>a+r.food.cal*r.mult,0);
  console.assert(Math.abs(kcal(withC)-kcal(noC))<=kcal(withC)*.25,
    "which spelling you use must not move the day much",kcal(withC),kcal(noC));
  console.assert(pl("roti dal chawal").some(r=>r.food.n==="Dal Chawal"),
    "an exact multi-word dish name must win the walk",pl("roti dal chawal").map(r=>r.food.n));
  console.assert(withC[0].mult===2&&noC[0].mult===2,"a leading 2 is a quantity, not a dish");
  console.assert(withC.slice(1).every(r=>r.mult===1),"the quantity must not leak into the next dish",withC);
  // A name that is itself two words has to survive the word-by-word walk.
  console.assert(pl("dal makhani").length===1&&pl("dal makhani")[0].food.n==="Dal Makhani",
    "an exact two-word name must stay one dish",pl("dal makhani"));
  console.assert(pl("half plate rice")[0].mult===0.5,"'half' is a quantity",pl("half plate rice"));
  console.assert(pl("1 bowl dal").length===1&&pl("1 bowl dal")[0].food.n==="Dal Tadka",
    "serving words are noise, not dishes",pl("1 bowl dal"));
  const junk=parseLine("zzzqq");
  console.assert(junk.rows.filter(r=>r.food).length===0&&junk.rows.filter(r=>r.miss).length===1,
    "nonsense must resolve to nothing, and be reported rather than swallowed",junk.rows);
  console.assert(pl("2").length===0,"a bare number must not match every '1 bowl (200g)' serving");
  console.assert(typedBar("dal").indexOf("typed-bar")===-1,"one dish must not raise the bar");
  console.assert(typedBar("roti dal").indexOf("typed-bar")>-1,"two dishes must raise the bar");

  // ---- mkItem: the one place a logged row is built ----
  const mf={n:"T",e:"x",s:"1 bowl",cal:100,p:10,c:20,f:5,fib:2};
  const mi=mkItem(mf,2,"lunch");
  console.assert(mi.cal===200&&mi.p===20&&mi.c===40&&mi.f===10&&mi.fib===4,
    "mkItem must scale every macro",mi);
  console.assert(mi.meal==="lunch"&&mi.qtyLabel==="2× 1 bowl","mkItem label or meal wrong",mi);
  console.assert(mkItem(mf,1,"lunch").qtyLabel==="1 bowl","a single serving keeps the plain label");
  console.assert(mkItem(mf,1,"lunch").id!==mkItem(mf,1,"lunch").id,"every new log needs its own id");
  console.assert(mkItem(mf,1,"lunch",{id:"keep"}).id==="keep",
    "an edit must keep its id, or the upsert writes a second row");

  // ---- this week ----
  const ws=weekStats();
  console.assert(ws.now&&ws.was&&ws.now.logged<=7&&ws.was.logged<=7,
    "weekStats must split fourteen days into two sevens",ws);
  const short={now:{logged:6,cal:1800,p:S.profile.p*.4,fib:1e4,water:1e5},
               was:{logged:6,cal:1800,p:0,fib:0,water:0}};
  console.assert(/protein/i.test(weekTip(short).t),"a protein gap is what the tip should talk about",
    weekTip(short));
  const clean={now:{logged:7,cal:1800,p:S.profile.p,fib:S.profile.fib,water:S.profile.waterGoal},
               was:{logged:7,cal:1800,p:0,fib:0,water:0}};
  console.assert(!/short|only/i.test(weekTip(clean).t),"a clean week must not be told off",weekTip(clean));
  console.assert(weekTip({now:{logged:0,cal:0,p:0,fib:0,water:0},was:{logged:0}}).t.length>0,
    "an empty week still gets a line");
  console.assert(viewWeek().indexOf("wk-tip")>-1,"the weekly card must draw its tip");
}
devCheck();

/* ============================ ACCOUNTS ============================ */
let authMode="in"; // "in" = sign in, "up" = create account
/* The cook's four moods. Every failure path already funnels through
   authError(), so hooking the head shake there covers wrong passwords,
   empty fields and network errors in one place. */
const mascot=$("#mascot");
let moodT=null;
function mood(m){
  clearTimeout(moodT);
  if(mascot.dataset.mood===m&&m==="no"){ mascot.dataset.mood="idle"; void mascot.offsetWidth; }
  mascot.dataset.mood=m;
  if(m==="no") moodT=setTimeout(rest,1050);
}
// Resting face depends on whether the password box still has the caret.
function rest(){ mood(document.activeElement===$("#au-pass")?"peek":"idle"); }
$("#au-pass").addEventListener("focus",()=>{ if(mascot.dataset.mood!=="yes") mood("peek"); });
$("#au-pass").addEventListener("blur",()=>{ if(mascot.dataset.mood==="peek") mood("idle"); });
function showAuth(){
  // Whoever signs in next starts on Today, not on the tab the last session
  // left open. Every route to the sign-in screen comes through here.
  TAB="today";
  $("#auth").hidden=false;
  rest();
  $("#auth-tag").textContent = authMode==="in"
    ? "Sign in to reach your logs from any device."
    : "Create an account and your logs follow you everywhere.";
  $("#au-go").textContent = authMode==="in" ? "Sign in" : "Create account";
  $("#au-name-field").hidden = authMode!=="up";
  $("#au-pass").setAttribute("autocomplete",authMode==="in"?"current-password":"new-password");
  $("#auth-alt").innerHTML = authMode==="in"
    ? `New here? <button type="button" data-authmode="up">Create an account</button>`
    : `Already have one? <button type="button" data-authmode="in">Sign in</button>`;
}
// Hold the overlay a beat when the cook is mid thumbs-up, so the sign-in
// actually reads as approved instead of blinking straight past.
function hideAuth(){
  const wait=mascot.dataset.mood==="yes"?800:0;
  setTimeout(()=>{ $("#auth").hidden=true; authError(""); mood("idle"); },wait);
}
// Pass note=true for a message that is not a refusal: it turns the box amber
// and leaves the laddoo alone instead of shaking his head at you.
function authError(msg,note){
  const el=$("#auth-err"); el.textContent=msg||""; el.hidden=!msg;
  el.classList.toggle("note",!!note);
  if(msg&&!note) mood("no");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-authmode]");
  if(b){ authMode=b.dataset.authmode; authError(""); showAuth(); }
});
$("#auth-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const email=$("#au-email").value.trim(), pass=$("#au-pass").value;
  const name=$("#au-name").value.trim();
  if(!email||!pass){ authError("Enter your email and password."); return; }
  if(authMode==="up"&&!name){ authError("Enter your name."); return; }
  if(authMode==="up"&&pass.length<6){ authError("Use at least 6 characters."); return; }
  const btn=$("#au-go"); const label=btn.textContent;
  btn.disabled=true; btn.textContent="Working…"; authError("");
  try{
    const r = authMode==="in"
      ? await sb.auth.signInWithPassword({email,password:pass})
      // The name rides along in the account metadata, so it survives the
      // email-confirmation round trip and is there at the next sign-in.
      : await sb.auth.signUp({email,password:pass,options:{data:{name}}});
    if(r.error) throw r.error;
    if(r.data&&r.data.session) mood("yes");
    // With email confirmation switched on, signUp returns no session yet.
    if(authMode==="up"&&!r.data.session){
      authMode="in"; showAuth();
      authError("Check your email to confirm the account, then sign in.",true);
    }
  }catch(err){
    authError(err&&err.message?err.message:"That didn't work. Try again.");
  }finally{ btn.disabled=false; btn.textContent=label; }
});
async function signOut(){
  try{ await sb.auth.signOut(); }catch(e){}
  USER=null; S=loadState(); showAuth();
}
async function onSession(session){
  if(!session||!session.user){ USER=null; showAuth(); return; }
  USER={id:session.user.id,email:session.user.email,
    name:((session.user.user_metadata||{}).name||"").trim()};
  hideAuth();
  S=loadState();          // paint instantly from this account's cache
  if(!S.profile.name&&USER.name) S.profile.name=USER.name;
  render();
  try{ await pull(); render(); }                           // reconcile with server
  catch(e){ console.error("[pull]",e); toast("Couldn't load your account — showing the last copy"); }
  // Asked once, after the account's own numbers have landed. age is 0 on a new
  // profile and -1 once someone has said "not now", so neither gets asked twice.
  if(!S.profile.age) setTimeout(openTarget,600);
}

/* ============================ GO ============================ */
async function boot(){
  if(!CLOUD){ render(); return; }   // no Supabase configured: device-only mode
  try{
    const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  }catch(e){
    console.error("[supabase]",e);
    render(); toast("Couldn't reach the sign-in service — saving on this device only");
    return;
  }
  sb.auth.onAuthStateChange((_evt,session)=>onSession(session));
  const {data}=await sb.auth.getSession();
  onSession(data.session);
}
boot();
</script>
