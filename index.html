<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9ECEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)">
<meta name="description" content="Track calories, macros and daily habits. Built around Indian home food.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nourish me Bro">
<title>Nourish me Bro &mdash; calories &amp; habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400..800&display=swap">
<style>
/* ============================================================
   NOURISH ME BRO - steel & haldi
   Ground: brushed steel. Energy: a single turmeric ramp where
   darkness = time of day. Macros: four spread hues, always
   labelled in text as well as colour.
   ============================================================ */
:root{
  --bg:#E9ECEE; --surface:#FFFFFF; --surface-2:#F2F4F6; --sunk:#E3E7EA;
  --line:#D7DDE1; --line-2:#C3CBD1;
  --ink:#15191C; --ink-2:#4E585F; --ink-3:#7F8B93;

  /* Meal ramp: the sky through one day, dawn gold to night indigo. Four shades
     of one hue looked handsome and told you nothing -- on a 30px bar they read
     as one colour. Hue carries the meal now, lightness only reinforces it. */
  --r1:#F6C445; --r2:#E4832A; --r3:#A9503C; --r4:#3F4E8C;
  --accent:#A0680B; --accent-bright:#E8A63A; --accent-soft:#FAF0DC;

  --m-p:#BE3A2B; --m-c:#3B5BA5; --m-f:#7A4B9E; --m-fib:#2E7D51;
  --water:#0E7F9C; --water-soft:#DEF0F4;
  --danger:#BE3A2B;

  --shadow:0 1px 1px rgba(21,25,28,.04), 0 6px 18px rgba(21,25,28,.05);
  --shadow-lg:0 16px 48px rgba(21,25,28,.22);
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1113; --surface:#181C1F; --surface-2:#212629; --sunk:#101416;
  --line:#2A3034; --line-2:#3A4247;
  --ink:#ECEFF1; --ink-2:#A3ADB4; --ink-3:#727D84;
  --r1:#F7CE63; --r2:#EF954A; --r3:#D2705F; --r4:#7E8BD6;
  --accent:#F0BE62; --accent-bright:#DCA13B; --accent-soft:#2B2313;
  --m-p:#E8695A; --m-c:#7C9BE0; --m-f:#B48BD8; --m-fib:#54B583;
  --water:#4FB8D6; --water-soft:#11313A;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0E1113; --surface:#181C1F; --surface-2:#212629; --sunk:#101416;
  --line:#2A3034; --line-2:#3A4247;
  --ink:#ECEFF1; --ink-2:#A3ADB4; --ink-3:#727D84;
  --r1:#F7CE63; --r2:#EF954A; --r3:#D2705F; --r4:#7E8BD6;
  --accent:#F0BE62; --accent-bright:#DCA13B; --accent-soft:#2B2313;
  --m-p:#E8695A; --m-c:#7C9BE0; --m-f:#B48BD8; --m-fib:#54B583;
  --water:#4FB8D6; --water-soft:#11313A;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* iOS zooms into any control under 16px on focus. Never go below. */
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;touch-action:manipulation}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Archivo with the width axis opened up - digits read like a scale readout */
.num{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 112,"wght" 800;
  font-variant-numeric:tabular-nums;letter-spacing:-.015em}

/* ---------------- shell ---------------- */
.app{
  max-width:460px; margin:0 auto; position:relative;
  height:100vh; height:100dvh;
  background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
}
@media(min-width:560px){
  body{background:var(--sunk)}
  .app{height:min(900px,94dvh);margin:3dvh auto;border-radius:26px;
    box-shadow:var(--shadow-lg);border:1px solid var(--line)}
}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 14px 24px;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}

.top{padding:calc(var(--safe-t) + 16px) 14px 10px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;flex:none}
.top .date{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3)}
.top h1{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 105,"wght" 800;
  font-size:25px;letter-spacing:-.02em;line-height:1.05;margin-top:3px}
.iconbtn{width:44px;height:44px;margin:-6px -8px -6px 0;border-radius:12px;display:grid;
  place-items:center;flex:none;font-size:17px;color:var(--ink-2);transition:background .15s}
.iconbtn:active{background:var(--surface-2)}

.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);
  box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card > h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;
  align-items:center;gap:10px}
.card > h2 button{color:var(--accent);font-size:12px;font-weight:700;text-transform:none;
  letter-spacing:.01em;padding:4px 0;min-height:32px}

/* ---------------- SIGNATURE: the budget rail ----------------
   Every logged dish is a slab in one tray. Shade = which meal.
   A donut says how much is left; this says what spent it.      */
.hero{padding:18px 16px 16px}
.hero .lede{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hero .big{font-size:clamp(46px,15.5vw,64px);line-height:.92}
.hero .big.over{color:var(--danger)}
.hero .unit{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.hero .sub{font-size:13px;color:var(--ink-3);font-weight:600;margin-top:7px;
  font-variant-numeric:tabular-nums}

.rail{margin-top:18px}
.rail-bar{position:relative;padding-top:10px}
.rail-track{display:flex;height:30px;border-radius:7px;overflow:hidden;
  background:var(--sunk);box-shadow:inset 0 1px 2px rgba(21,25,28,.08)}
.rail-track .seg{height:100%;min-width:2px;box-shadow:inset -1.5px 0 0 var(--surface);
  transition:width .5s cubic-bezier(.4,1.1,.5,1)}
.rail-track .seg:last-child{box-shadow:none}
.rail-goal{position:absolute;top:10px;bottom:0;width:2px;background:var(--ink);z-index:2;
  pointer-events:none}
.rail-goal::after{content:"GOAL";position:absolute;top:-11px;right:0;font-size:8.5px;
  font-weight:800;letter-spacing:.09em;color:var(--ink);white-space:nowrap}
.rail-empty{position:absolute;left:0;right:0;top:10px;bottom:0;display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--ink-3);pointer-events:none}
.rail-key{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:11px}
.rail-key span{font-size:11px;font-weight:700;color:var(--ink-2);display:flex;
  align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;border-radius:2.5px;flex:none}

/* macros - same rail language, one row each */
.macros{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;
  display:flex;flex-direction:column;gap:11px}
.mrow{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:11px}
.mrow .mk{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2)}
.mrow .mtrack{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.mrow .mtrack i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.mrow .mv{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);min-width:66px;text-align:right}
.mrow .mv em{font-style:normal;color:var(--ink-3);font-weight:600}

/* ---------------- water ---------------- */
.water-row{display:flex;align-items:center;gap:15px}
.glass{position:relative;width:46px;height:60px;flex:none;border:2.5px solid var(--water);
  border-top:none;border-radius:4px 4px 12px 12px;overflow:hidden;background:var(--water-soft)}
.glass .fill{position:absolute;left:0;right:0;bottom:0;background:var(--water);
  transition:height .5s cubic-bezier(.4,1.2,.5,1)}
.water-info{flex:1;min-width:0}
.water-info .num{font-size:24px}
.water-info .sub{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px;
  font-variant-numeric:tabular-nums}
.water-btns{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:0 13px;min-height:40px;font-size:13px;font-weight:700;display:flex;
  align-items:center;gap:5px;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.water{color:var(--water)}
.chip.minus{color:var(--ink-3);padding:0 15px}

/* ---------------- meals ---------------- */
/* The meal's shade rides the card edge, so scrolling Today runs the same
   dawn-to-night ramp as the rail above it. The legend keeps the swatches. */
.meal{padding:14px 16px;box-shadow:var(--shadow),inset 3px 0 0 var(--tone)}
.meal.is-empty{padding:11px 16px}
.meal.is-empty .cal{color:var(--ink-3)}
.meal-head{display:flex;align-items:center;gap:9px}
.meal-head .em{font-size:15px}
.meal-head .t{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.meal-head .cal{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--ink)}
.meal-add{color:var(--accent);font-weight:700;font-size:13px;padding:0 4px;min-height:40px;
  display:flex;align-items:center}
/* per-meal macro totals */
.meal-tot{display:flex;flex-wrap:wrap;gap:3px 10px;margin:8px 0 2px 24px;font-size:11.5px;
  font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.meal-tot b{font-weight:800;color:var(--ink-2)}

.fi{display:flex;align-items:flex-start;gap:10px;padding:11px 0;
  border-top:1px solid var(--line)}
.fi:first-of-type{border-top:none}
.fi .fi-em{font-size:19px;line-height:1.25;flex:none;width:22px;text-align:center}
.fi .fi-b{flex:1;min-width:0}
.fi .fi-n{font-size:14.5px;font-weight:700;line-height:1.25}
.fi .fi-q{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px}
/* per-item macros - always visible, never behind a tap */
.fi-macros{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.fi-macros b{font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2.5px 6px;
  border-radius:5px;font-variant-numeric:tabular-nums;background:var(--surface-2);
  color:var(--tone);border:1px solid var(--line)}
.fi .fi-cal{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
  padding-top:1px;flex:none}
.fi .del{color:var(--ink-3);font-size:14px;width:34px;height:34px;margin:-6px -8px 0 0;
  flex:none;display:grid;place-items:center;border-radius:8px}
.fi .del:active{background:var(--surface-2)}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:16px 0 6px;font-weight:600}
/* The logged row's body is a button now; it must not look like one. */
.fi .fi-b{background:none;border:none;padding:0;text-align:left;font:inherit;color:inherit}
.fi .fi-b:active .fi-n{color:var(--accent)}
/* Offered on an empty meal, so it sits where the food would have been. */
.copy-y{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  margin-top:10px;min-height:44px;border-radius:10px;background:var(--surface-2);
  border:1px dashed var(--line-2);font-size:13px;font-weight:700;color:var(--ink-2)}
.copy-y b{font-weight:800;color:var(--ink)}
.copy-y:active{background:var(--accent-soft);border-color:var(--accent)}
.quick-link{width:100%;text-align:left;padding:2px 0 10px;color:var(--accent);
  font-size:13px;font-weight:800;min-height:36px}

/* Shown only when the browser refuses to persist anything (sandboxed frame,
   private mode). Silent data loss is worse than an ugly banner. */
.warn{display:flex;gap:9px;align-items:flex-start;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:11px;padding:12px 13px;margin-bottom:12px;
  font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.45}
.warn b{font-weight:800;display:block;margin-bottom:2px}

/* ---------------- habits ----------------
   The day stepper. It only turns amber once you have stepped off today, so the
   normal case stays quiet and a backdated tick is impossible to miss. */
.daybar{display:flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:6px;margin-bottom:12px}
.daybar > div{flex:1;min-width:0;text-align:center;line-height:1.25}
.daybar b{display:block;font-size:14px;font-weight:800}
.daybar span{font-size:11px;font-weight:700;color:var(--ink-3);
  letter-spacing:.06em;text-transform:uppercase}
.daybar button{width:44px;height:44px;flex:none;border-radius:11px;font-size:20px;
  font-weight:800;color:var(--ink-2);display:grid;place-items:center;line-height:1}
.daybar button:active{background:var(--surface-2)}
.daybar button[disabled]{color:var(--line-2);cursor:default}
.daybar.past{border-color:var(--accent);background:var(--accent-soft)}
.daybar.past b,.daybar.past span{color:var(--accent)}

/* ---------------- habits ---------------- */
.habit{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:none}
.habit .h-em{width:42px;height:42px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none}
.habit .h-body{flex:1;min-width:0}
.habit .h-name{font-weight:700;font-size:14.5px}
.habit .h-streak{font-size:11.5px;color:var(--ink-3);font-weight:700;display:flex;
  align-items:center;gap:8px;margin-top:1px}
.habit .h-streak.live{color:var(--accent)}
.habit .h-streak button{color:var(--ink-3);font-size:11.5px;font-weight:700;
  text-decoration:underline;text-underline-offset:2px;min-height:30px}
.check{width:40px;height:40px;border-radius:11px;border:2px solid var(--line-2);flex:none;
  display:grid;place-items:center;font-size:17px;color:transparent;
  transition:transform .15s,background .15s,border-color .15s}
.check.on{background:var(--m-fib);border-color:var(--m-fib);color:#fff}
.check:active{transform:scale(.88)}
.counter{display:flex;align-items:center;gap:6px;flex:none}
.counter button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line);font-size:17px;font-weight:800;display:grid;place-items:center;
  line-height:1}
.counter .cval{min-width:44px;text-align:center;font-size:14px;font-weight:800;
  font-variant-numeric:tabular-nums}
.counter .cval small{color:var(--ink-3);font-weight:700}

/* ---------------- the week rail ----------------
   The budget rail stood on end. One column a day, sliced the same way: meal
   shade for calories, one lane per habit on the habits tab. The goal is drawn
   once across all seven days instead of being marked seven times. */
.wkplot{position:relative;display:flex;align-items:flex-end;gap:7px;height:104px;
  padding-top:8px;border-bottom:1px solid var(--line-2)}
.wkcol{flex:1;min-width:0;height:100%;display:flex;justify-content:center}
.wkbar{width:100%;max-width:24px;height:100%;background:var(--sunk);border-radius:5px;
  overflow:hidden;display:flex;flex-direction:column-reverse;justify-content:flex-start}
.wkbar i{display:block;width:100%;flex:none;transition:height .45s ease}
.wkbar i+i{box-shadow:inset 0 -1.5px 0 var(--surface)}
.wkgoal{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink-2);
  z-index:2;pointer-events:none}
.wkgoal b{position:absolute;right:0;top:-12px;font-size:8.5px;font-weight:800;
  letter-spacing:.09em;color:var(--ink-2);background:var(--surface);padding:0 3px}
.wklabels{display:flex;gap:7px;margin-top:9px}
.wklabels span{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:700;
  color:var(--ink-3)}
.wklabels .is-today{color:var(--accent)}
.wklabels .is-over{color:var(--danger)}
.wknote{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:11px;line-height:1.45}

/* ---------------- foods tab ---------------- */
.search{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:0 14px;min-height:48px;
  box-shadow:var(--shadow);margin:2px 0 11px}
.search input{border:none;background:none;flex:1;min-width:0;outline:none;padding:12px 0}
.search .ic{color:var(--ink-3);font-size:15px;flex:none}
.cats{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{height:0}
.cat{white-space:nowrap;padding:0 14px;min-height:38px;display:flex;align-items:center;
  border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px;
  font-weight:700;flex:none;color:var(--ink-2)}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-3);padding:16px 0 2px}
.cat-h:first-child{padding-top:2px}
.pick{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-top:1px solid var(--line);width:100%;text-align:left}
.pick:first-of-type{border-top:none}
.pick .p-em{font-size:20px;flex:none;width:24px;text-align:center}
.pick .p-b{flex:1;min-width:0}
.pick .p-n{font-size:14.5px;font-weight:700;line-height:1.25}
.pick .p-s{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;
  font-variant-numeric:tabular-nums}
.pick .p-cal{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.pick .p-add{color:var(--accent);font-size:19px;font-weight:700;line-height:1;flex:none;
  width:22px;text-align:center}
.addfood-link{text-align:center;padding:16px 0 4px;color:var(--accent);font-weight:700;
  font-size:13.5px;width:100%;min-height:44px}

/* ---------------- forms ---------------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.07em}
.inrow{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:0 13px;min-height:48px}
.inrow input{flex:1;min-width:0;border:none;background:none;outline:none;padding:13px 0}
.inrow .unit{color:var(--ink-3);font-size:13px;font-weight:700;flex:none}
/* min-width:0 or the number inputs keep their intrinsic size and push the
   whole card wider than the phone. */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid2>*{min-width:0}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;
  padding:14px;border-radius:12px;background:var(--accent);color:#FFFFFF;font-weight:800;
  font-size:15px;text-align:center;transition:transform .1s}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#15191C}}
:root[data-theme="dark"] .btn{color:#15191C}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .btn.ghost{color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
:root[data-theme="dark"] .btn.danger{color:var(--danger)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:var(--danger)}}
.stack{display:flex;flex-direction:column;gap:9px}

/* ---------------- nav + fab ---------------- */
.nav{flex:none;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--surface);border-top:1px solid var(--line);display:flex;
  align-items:stretch;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--ink-3);font-size:10px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase}
.nav button svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:var(--accent)}

/* No floating action button: it sat over the calorie figures it was meant to
   help you read, and each meal's own "+ Add" already pre-selects that meal. */

/* ---------------- sheet ---------------- */
.scrim{position:fixed;inset:0;background:rgba(14,17,19,.55);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,101%);width:100%;
  max-width:460px;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;
  transition:transform .34s cubic-bezier(.32,.72,0,1);max-height:88dvh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  border:1px solid var(--line);border-bottom:none;visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.sheet.tall{height:88dvh}
.sheet .grab{width:36px;height:4px;background:var(--line-2);border-radius:2px;
  margin:9px auto 2px;flex:none}
.sheet .sh-head{padding:8px 18px 10px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex:none}
.sheet .sh-head h3{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 105,"wght" 800;
  font-size:18px;letter-spacing:-.01em}
.sheet .sh-head .x{font-size:17px;color:var(--ink-2);width:38px;height:38px;margin-right:-9px;
  display:grid;place-items:center;border-radius:10px;flex:none}
.sheet .sh-head .x:active{background:var(--surface-2)}
.sheet .sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 18px calc(22px + var(--safe-b));flex:1 1 auto;min-height:0;
  overscroll-behavior:contain}
/* search stays pinned so results are reachable without scrolling back up */
.sh-body .search.pin{position:sticky;top:0;z-index:3;margin:0 0 8px;box-shadow:none}

.qty-food{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.qty-food .qf-em{font-size:28px}
.qty-food .qf-n{font-weight:800;font-size:16.5px;line-height:1.2}
.qty-food .qf-s{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.flabel{display:block;font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.07em}
.seg{display:flex;gap:7px;margin:0 0 16px}
.seg button{flex:1;min-width:0;min-height:46px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meal-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
.meal-pick button{padding:11px 2px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line);font-weight:700;font-size:11.5px;display:flex;
  flex-direction:column;gap:4px;align-items:center;color:var(--ink-2);min-height:58px;
  justify-content:center}
.meal-pick button .em{font-size:16px}
.meal-pick button.on{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent)}
/* A stacked choice: the label answers, the line under it explains. Used where
   the options need a sentence and a segmented control would clip them. */
.opt{display:block;width:100%;text-align:left;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:52px}
.opt b{display:block;font-size:14px;font-weight:800;color:var(--ink)}
.opt span{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-top:1px}
.opt.on{background:var(--accent-soft);border-color:var(--accent)}
.opt.on b{color:var(--accent)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 30%;min-height:40px;font-size:12.5px;padding:0 6px}

/* The number the whole sheet exists to produce. It is a suggestion, so it
   shows its working underneath rather than arriving as an instruction. */
.suggest{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;
  padding:14px;margin-bottom:16px;text-align:center}
.suggest .big{font-size:40px;line-height:1;color:var(--accent)}
.suggest .lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin-top:4px}
.suggest p{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.5;margin-top:10px}
.suggest.waiting{background:var(--surface-2);border-color:var(--line);border-style:dashed}
.suggest.waiting span{font-size:12.5px;font-weight:600;color:var(--ink-3)}

.nutri-prev{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:11px;padding:13px 6px;margin-bottom:16px}
.nutri-prev div{text-align:center;min-width:0}
.nutri-prev .v{font-size:16px}
.nutri-prev .k{font-size:9.5px;color:var(--ink-3);font-weight:800;text-transform:uppercase;
  letter-spacing:.04em;margin-top:2px}
.ta{width:100%;height:170px;border:1px solid var(--line);border-radius:11px;padding:12px;
  background:var(--surface-2);color:var(--ink);font-size:16px;resize:none;outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.4}
.hint{font-size:13px;color:var(--ink-2);margin-bottom:10px;line-height:1.5}

/* ---------------- sign in ---------------- */
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px 20px;overflow-y:auto}
.auth[hidden]{display:none}
.auth-in{width:100%;max-width:360px}
.auth h1{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 112,"wght" 800;
  font-size:40px;letter-spacing:-.03em;line-height:1}
.auth .tag{color:var(--ink-2);font-size:14px;font-weight:600;margin:8px 0 26px;line-height:1.5}
.auth .ramp{display:flex;gap:3px;margin-bottom:22px}
.auth .ramp i{height:7px;flex:1;border-radius:2px}
.auth .err{background:var(--accent-soft);border:1px solid var(--danger);color:var(--danger);
  border-radius:9px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:13px;
  line-height:1.45}
/* Same box, but for news rather than a refusal: nothing went wrong. */
.auth .err.note{border-color:var(--accent);color:var(--accent)}
.auth .alt{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-2);font-weight:600}
.auth .alt button{color:var(--accent);font-weight:800;font-size:13px;padding:6px;
  text-decoration:underline;text-underline-offset:2px}
.auth .note{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center;
  margin-top:22px;line-height:1.5}

/* ---------------- the laddoo ----------------
   One round sweet sitting in a steel plate. He blinks while you read, hides
   behind his mitts while you type your password (and sneaks one peek), shakes
   when a sign-in is refused, and holds up a spoon when it lands. Every state is
   driven by one data-mood attribute so the JS stays to one line.
   His colours are fixed hexes, not tokens: he stays golden in both themes while
   the plate behind him flips. */
.mascot{width:138px;margin:0 auto 18px;display:block}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.m-plate{fill:var(--surface);stroke:var(--line-2);stroke-width:2}
.m-rim{fill:none;stroke:var(--line-2);stroke-width:1.5;opacity:.75}
/* one ink weight around every shape, and nothing hairline: that is what makes
   him read as a cartoon rather than an icon */
.m-ink{stroke:#4A3010;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.m-body{fill:#EDA93E}
.m-limb{fill:#E39C31}
.m-crumb{fill:#C8811C}
.m-white{fill:#FFFFFF}
.m-pupil{fill:#3A2712}
.m-shine{fill:#FFFFFF}
.m-cheek{fill:#D9542F;opacity:.32}
.m-line{fill:none;stroke:#3A2712;stroke-width:3.6;stroke-linecap:round}
.m-fill{fill:#3A2712}
.m-spoon{fill:#F2F5F6}
.m-head,.m-eyes,.m-hand,.m-hold{transform-box:view-box}

/* eyes: a slow blink is the whole idle state -- no drifting, no floating */
.m-eyes{transform-origin:60px 58px;animation:m-blink 6.5s infinite}
@keyframes m-blink{0%,93%,97%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.m-joy{opacity:0}
[data-mood="yes"] .m-eyes{opacity:0;animation:none}
[data-mood="yes"] .m-joy{opacity:1}

/* mouth: one shape per mood, cross-faded */
.m-mouth{opacity:0;transition:opacity .16s}
[data-mood="idle"] .m-smile,[data-mood="peek"] .m-smile{opacity:1}
[data-mood="no"] .m-frown{opacity:1}
[data-mood="yes"] .m-grin{opacity:1}

/* mitts: parked off-canvas, up over the eyes while the password is focused.
   Each arm is two strokes on one curve, dark under gold, so the limb outlines
   itself and stays attached to him instead of floating. */
.m-arm-ink{fill:none;stroke:#4A3010;stroke-width:17;stroke-linecap:round}
.m-arm{fill:none;stroke:#E39C31;stroke-width:11;stroke-linecap:round}
.m-hand{transform-origin:0 0;transform:translate(60px,150px);opacity:0;
  transition:transform .3s cubic-bezier(.34,1.45,.64,1),opacity .2s}
[data-mood="peek"] .m-hand{opacity:1}
[data-mood="peek"] .m-hl{transform:translate(45px,58px);animation:m-peek-l 5s ease-in-out 1.5s infinite}
[data-mood="peek"] .m-hr{transform:translate(75px,58px)}
@keyframes m-peek-l{
  0%,70%,100%{transform:translate(45px,58px)}
  77%,87%{transform:translate(38px,76px)}
}

/* the spoon, held up on a good sign-in */
.m-hold{transform-origin:0 0;transform:translate(72px,150px);opacity:0;
  transition:transform .42s cubic-bezier(.34,1.6,.6,1) .1s,opacity .2s .1s}
[data-mood="yes"] .m-hold{opacity:1;transform:translate(93px,50px) rotate(13deg)}

/* head */
.m-head{transform-origin:60px 98px}
[data-mood="no"] .m-head{animation:m-no .5s ease-in-out 2}
[data-mood="yes"] .m-head{animation:m-nod .55s ease-in-out}
@keyframes m-no{0%,100%{transform:rotate(0)}22%{transform:rotate(-12deg)}
  50%{transform:rotate(11deg)}78%{transform:rotate(-7deg)}}
@keyframes m-nod{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px)}
  65%{transform:translateY(1px)}}

@media (prefers-reduced-motion:reduce){
  .mascot *{animation:none!important;transition:none!important}
}

.signout{color:var(--danger);font-weight:700;font-size:13px}
.whoami{font-size:11.5px;color:var(--ink-3);font-weight:700;margin-top:10px;text-align:center;
  word-break:break-all}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 24px);
  transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:12px 18px;
  border-radius:11px;font-weight:700;font-size:13.5px;z-index:60;opacity:0;
  pointer-events:none;transition:.26s;box-shadow:var(--shadow-lg);white-space:nowrap;
  max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

.burst{position:fixed;z-index:70;font-size:22px;pointer-events:none;
  animation:conf .95s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) scale(.4)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.05)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
/* ---------------- type a whole meal ---------------- */
/* Shows up in the picker only once the search text reads as two or more
   dishes, so searching for one thing is exactly as it was. */
.typed-bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;margin:2px 0 4px;border-radius:11px;background:var(--accent-soft);
  border:1px solid var(--accent);min-height:52px}
.typed-bar:active{filter:brightness(.96)}
.typed-bar .tb-em{font-size:19px;flex:none}
.typed-bar .tb-b{flex:1;min-width:0}
.typed-bar b{display:block;font-size:14px;font-weight:800;color:var(--ink)}
.typed-bar .tb-s{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typed-bar .tb-cal{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;
  flex:none}

.brow{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:none}
.brow .b-em{font-size:19px;flex:none;width:22px;text-align:center}
.brow .b-b{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;
  font:inherit;color:inherit}
.brow .b-n{font-size:14px;font-weight:700;line-height:1.25;display:block}
.brow .b-s{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .b-b:active .b-n{color:var(--accent)}
.bqty{display:flex;align-items:center;flex:none;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px}
.bqty button{width:30px;height:34px;font-size:15px;font-weight:800;color:var(--ink-2)}
.bqty button:active{color:var(--accent)}
.bqty b{font-size:12px;font-weight:800;min-width:32px;text-align:center;
  font-variant-numeric:tabular-nums}
.brow .b-cal{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;flex:none;
  min-width:36px;text-align:right}
.brow .b-x{color:var(--ink-3);font-size:13px;width:30px;height:34px;flex:none;
  display:grid;place-items:center;border-radius:8px}
.brow .b-x:active{background:var(--surface-2)}
.bmiss{font-size:12.5px;color:var(--ink-3);font-weight:600;padding:10px 0;line-height:1.5;
  border-top:1px solid var(--line)}
.bmiss b{color:var(--ink-2);font-weight:800}
.btotal{display:flex;justify-content:space-between;align-items:baseline;
  padding:13px 0 15px;font-size:11px;font-weight:800;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.07em}
.btotal span{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;
  text-transform:none;letter-spacing:0}

/* ---------------- weekly card ---------------- */
.wk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wk-stats div{text-align:center;min-width:0}
.wk-stats .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.wk-stats .k{font-size:9.5px;color:var(--ink-3);font-weight:800;text-transform:uppercase;
  letter-spacing:.04em;margin-top:3px}
/* Deltas stay grey on purpose: a heavier week is information, not a telling-off. */
.wk-stats .d{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-top:4px;
  font-variant-numeric:tabular-nums}
.wk-tip{display:flex;gap:10px;align-items:flex-start;margin-top:15px;padding-top:14px;
  border-top:1px solid var(--line)}
.wk-tip .wt-i{font-size:18px;flex:none;line-height:1.4}
.wk-tip .wt-t{font-size:13px;line-height:1.5;color:var(--ink-2);font-weight:600}

</style>
</head>

function cacheKey(){ return USER?"nourish.cache."+USER.id:KEY; }

function loadState(){
  let s;

  if(!s||typeof s!=="object") s={};
  s.profile=Object.assign({name:"",calGoal:2000,p:120,c:220,f:60,fib:30,waterGoal:2500,glass:250,

  s.customFoods=s.customFoods||[];
  s.qty=s.qty||{};                 // dish -> last quantity, so the sheet opens where you left it
  return s;
}

/* save() takes a note of WHAT changed so each edit becomes one targeted write

async function push(w){
  try{
    if(w.profile) await chk(sb.from("profiles").upsert(rowProfile()));
    if(w.day)     await chk(sb.from("day_logs").upsert(rowDay(w.day)));
    // upsert, not insert: an edit keeps the entry's id on purpose, so the
    // second write of the same row has to update it rather than collide.
    if(w.meal)    await chk(sb.from("meal_entries").upsert(rowMeal(w.meal,w.day||todayStr())));
    if(w.unmeal)  await chk(sb.from("meal_entries").delete().eq("user_id",uid()).eq("id",w.unmeal));
    if(w.habit)   await chk(sb.from("habits").upsert(rowHabit(w.habit)));
    if(w.unhabit) await chk(sb.from("habits").delete().eq("user_id",uid()).eq("id",w.unhabit));
    if(w.food)    await chk(sb.from("custom_foods").insert(rowFood(w.food)));
    if(w.wipe)    await wipeCloud();
    if(w.bulk)    await pushAll();
  }catch(e){ syncFailed(e); }
}
// supabase-js resolves with {error} rather than throwing, so failures are easy
// to miss. Turn them back into exceptions.
async function chk(q){ const r=await q; if(r&&r.error) throw r.error; return r; }
function syncFailed(e){
  console.error("[sync]",e);
  toast("Not saved to your account — check your connection");
}
async function pushAll(){
  await chk(sb.from("profiles").upsert(rowProfile()));
  if(S.habits.length)      await chk(sb.from("habits").upsert(S.habits.map(rowHabit)));
  if(S.customFoods.length) await chk(sb.from("custom_foods").upsert(S.customFoods.map(rowFood)));
  const dayRows=[],mealRows=[];
  Object.keys(S.days).forEach(ds=>{
    const d=S.days[ds];
    dayRows.push({user_id:uid(),day:ds,water:d.water||0,habit_state:d.habits||{}});
    (d.meals||[]).forEach(m=>mealRows.push(rowMeal(m,ds)));
  });
  if(dayRows.length)  await chk(sb.from("day_logs").upsert(dayRows));
  if(mealRows.length) await chk(sb.from("meal_entries").upsert(mealRows));
}
async function wipeCloud(){
  for(const t of ["meal_entries","day_logs","habits","custom_foods"])
    await chk(sb.from(t).delete().eq("user_id",uid()));
  await chk(sb.from("profiles").upsert(rowProfile()));
}
// Day rows are tiny, so pull enough history for streaks; meals only need to
// cover today plus the week chart.
async function pull(){
  const back=n=>new Date(Date.now()-n*86400000).toLocaleDateString("en-CA");

    sb.from("profiles").select("*").eq("user_id",uid()).maybeSingle(),
    sb.from("habits").select("*").eq("user_id",uid()),
    sb.from("custom_foods").select("*").eq("user_id",uid()).order("created_at",{ascending:false}),
    sb.from("day_logs").select("*").eq("user_id",uid()).gte("day",back(400)),
    // Same window as day_logs: the You tab charts a year, so a fortnight of
    // meals is not enough to draw it.
    sb.from("meal_entries").select("*").eq("user_id",uid()).gte("day",back(400)).order("created_at"),
  ]);
  [prof,hab,foods,days,meals].forEach(r=>{ if(r.error) throw r.error; });

  if(prof.data){
    const d=prof.data;
    S.profile={name:d.name||"",calGoal:d.cal_goal,p:d.p,c:d.c,f:d.f,fib:d.fib,
      waterGoal:d.water_goal,glass:d.glass,
      age:d.age||0,sex:d.sex||"",height:d.height||0,weight:+d.weight||0,
      job:d.job||"",exercise:d.exercise||"",goal:d.goal||"maintain"};
  }
  // An account made before the name existed carries it in its auth metadata.
  if(!S.profile.name&&USER.name) S.profile.name=USER.name;
  S.days={};
  (days.data||[]).forEach(r=>{ S.days[r.day]={meals:[],water:r.water||0,habits:r.habit_state||{}}; });
  (meals.data||[]).forEach(r=>{
    const d=S.days[r.day]||(S.days[r.day]={meals:[],water:0,habits:{}});
    d.meals.push({id:r.id,name:r.name,e:r.emoji,meal:r.meal,cal:+r.cal,p:+r.p,c:+r.c,
      f:+r.f,fib:+r.fib,qtyLabel:r.qty_label});
  });
  S.habits=(hab.data||[]).map(r=>({id:r.id,name:r.name,e:r.emoji,type:r.kind,target:r.target}));
  S.customFoods=(foods.data||[]).map(r=>({id:r.id,n:r.name,e:r.emoji,s:r.serving,cal:+r.cal,
    p:+r.p,c:+r.c,f:+r.f,fib:+r.fib,cat:"My Foods",custom:true}));

  // First sign-in: give the account a profile row and the starter habits.
  // Also stamp a row that predates the name and email columns.
  // Local state is finished and saved BEFORE either write goes out: a write
  // that fails (a column this deploy expects and the database has not got yet)
  // must not leave the account with an empty habits tab.
  const seeding=!S.habits.length;
  if(seeding) S.habits=DEFAULT_HABITS.map(h=>Object.assign({},h));
  save();
  if(!prof.data||!prof.data.email||(!prof.data.name&&S.profile.name))
    await chk(sb.from("profiles").upsert(rowProfile()));
  if(seeding) await chk(sb.from("habits").upsert(S.habits.map(rowHabit)));
}

/* ============================ HELPERS ============================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const round=n=>Math.round(n||0);
const pct=(v,g)=>g>0?clamp(v/g,0,1)*100:0;
// Food and habit names come from user input and from imported backups, so
// every interpolated string goes through here before it reaches innerHTML.
const ESCS={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>ESCS[c]);

function sumMeals(meals){
  return (meals||[]).reduce((t,m)=>{
    t.cal+=m.cal||0; t.p+=m.p||0; t.c+=m.c||0; t.f+=m.f||0; t.fib+=m.fib||0; return t;
  },{cal:0,p:0,c:0,f:0,fib:0});
}
function allFoods(){ return S.customFoods.concat(FOODS); }
function mealOf(k){ return MEALS.find(m=>m.k===k)||MEALS[2]; }

function streak(habitId){
  const h=S.habits.find(x=>x.id===habitId); if(!h) return 0;
  let count=0; const now=Date.now();
  for(let i=0;i<400;i++){
    const ds=new Date(now-i*86400000).toLocaleDateString("en-CA");
    if(isHabitDone(h,S.days[ds])) count++;
    else if(i===0) continue;   // today not ticked yet - streak is still alive
    else break;
  }
  return count;
}
function isHabitDone(h,rec){
  if(!rec||!rec.habits) return false;
  const v=rec.habits[h.id];
  return h.type==="count" ? (v||0)>=(h.target||1) : !!v;
}

/* ---------- SIGNATURE: the budget rail ---------- */
function rail(items,goal){
  const total=items.reduce((a,b)=>a+(b.cal||0),0);
  const max=Math.max(goal||0,total)||1;
  // ordered breakfast -> dinner so the ramp reads light to dark, left to right
  const segs=[];
  MEALS.forEach(m=>items.filter(x=>x.meal===m.k)
    .forEach(x=>segs.push({w:(x.cal||0)/max*100,tone:m.tone,n:x.name,cal:x.cal})));
  const goalLeft=(goal||0)/max*100;
  const key=MEALS.map(m=>{
    const c=items.filter(x=>x.meal===m.k).reduce((a,b)=>a+(b.cal||0),0);
    return c>0?`<span><i class="sw" style="background:${m.tone}"></i>${esc(m.l)} ${round(c)}</span>`:"";
  }).join("");
  return `<div class="rail">
    <div class="rail-bar">
      <div class="rail-track">${
        segs.map(s=>`<i class="seg" style="width:${s.w}%;background:${s.tone}" title="${esc(s.n)} · ${round(s.cal)} kcal"></i>`).join("")
      }</div>
      ${total>0?`<div class="rail-goal" style="left:calc(${goalLeft}% - 1px)"></div>`:""}
      ${total===0?`<div class="rail-empty">Nothing logged yet</div>`:""}
    </div>
    ${key?`<div class="rail-key">${key}</div>`:""}
  </div>`;
}
function macroRow(label,val,goal,tone){
  // The bar caps at 100%, so past the goal the number carries the news instead.
  const over=goal>0&&val>goal;
  return `<div class="mrow">
    <span class="mk">${label}</span>
    <div class="mtrack"><i style="width:${pct(val,goal)}%;background:${tone}"></i></div>
    <span class="mv"${over?' style="color:var(--danger)"':""}>${round(val)}<em>/${round(goal)}g</em></span>
  </div>`;
}

function mealGroup(m,t){

// Every logged item carries its own macro breakdown, visible without a tap.

/* ---------- HABITS ---------- */
/* Habits get ticked late: you remember the walk after midnight, or forget to
   open the app for two days. The day stepper backdates a tick without letting

function dayLabel(ds){

  if(diff===0) return "Today";

function habitRow(h,rec){

/* ---------- the week rail ----------
   The You tab opens on the last 7 days; the rest of the history is one tap
   away and nothing else about the chart changes. */
const RANGES=[{k:7,l:"7 days"},{k:30,l:"30 days"},{k:90,l:"3 months"},{k:365,l:"A year"}];
let calRange=7;
function lastN(n){
  const now=Date.now(), out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(now-i*86400000), ds=d.toLocaleDateString("en-CA");
    out.push({ds, today:ds===todayStr(), letter:d.toLocaleDateString("en-US",{weekday:"narrow"})});
  }
  return out;
}
// cols: [{d,today,over,title,segs:[{h,tone}]}], segs stacked from the bottom up.
// The gap closes as columns multiply, so a year does not turn into all gutter.
function weekChart(cols,goalPct){
  const gap=cols.length>24?2:cols.length>12?4:7;
  return `<div class="wkchart">
    <div class="wkplot" style="gap:${gap}px">
      ${goalPct!=null?`<div class="wkgoal" style="bottom:${goalPct}%"><b>GOAL</b></div>`:""}
      ${cols.map(c=>`<div class="wkcol"><div class="wkbar" title="${esc(c.title)}">${
        c.segs.map(s=>`<i style="height:${s.h}%;background:${s.tone}"></i>`).join("")
      }</div></div>`).join("")}
    </div>
    <div class="wklabels" style="gap:${gap}px">${cols.map(c=>
      `<span class="${c.today?"is-today":c.over?"is-over":""}">${esc(c.d)}</span>`).join("")}</div>
  </div>`;
}
/* Breakfast at the foot of the column, dinner at the top: each day stacks up
   the way it was eaten, and the goal line cuts across the whole range at once.
   Past five weeks one column is one week, averaged per day -- 300 hairlines
   say less than 40 columns do, and the goal line stays a daily goal. */
function calStrip(n){
  const goal=S.profile.calGoal, days=lastN(n), step=n>35?7:1;
  const cols=[];
  for(let i=0;i<days.length;i+=step){
    const grp=days.slice(i,i+step);
    const items=grp.reduce((a,x)=>a.concat((S.days[x.ds]||{}).meals||[]),[]);
    cols.push({grp, cal:sumMeals(items).cal/grp.length,
      segs:MEALS.map(m=>({tone:m.tone,
        v:items.filter(y=>y.meal===m.k).reduce((a,b)=>a+(b.cal||0),0)/grp.length}))});
  }
  const max=Math.max(goal*1.12,...cols.map(c=>c.cal),1);
  // Labels thin out rather than overlap: weekdays for a fortnight, then dates.
  const label=(c,i)=>{
    const ds=c.grp[0].ds;
    if(step>1) return i%2?"":(+ds.slice(8))+"/"+(+ds.slice(5,7));
    if(cols.length<=14) return c.grp[0].letter;
    return i%Math.ceil(cols.length/6)?"":ds.slice(8);
  };
  return weekChart(cols.map((c,i)=>({
    d:label(c,i), today:c.grp.some(x=>x.today), over:c.cal>goal,
    title:`${round(c.cal)} kcal${step>1?" a day":""}`,
    segs:c.segs.filter(s=>s.v>0).map(s=>({h:s.v/max*100,tone:s.tone}))
  })),goal/max*100);
}
// Averages count only the days actually logged, so a week off does not read
// as a week of fasting.
function calStats(n){
  const goal=S.profile.calGoal;
  let logged=0,onTarget=0,cal=0,prot=0,water=0,wDays=0;
  lastN(n).forEach(x=>{
    const rec=S.days[x.ds]; if(!rec) return;
    const meals=rec.meals||[];
    if(meals.length){
      const t=sumMeals(meals);
      logged++; cal+=t.cal; prot+=t.p; if(t.cal<=goal) onTarget++;
    }
    if(rec.water){ water+=rec.water; wDays++; }
  });
  return {logged, onTarget,
    avgCal:logged?round(cal/logged):0, avgP:logged?round(prot/logged):0,
    avgWater:wDays?(water/wDays/1000).toFixed(1):"0.0"};
}

/* One habit keeps one lane all week, so a gap reads as "I always skip this one"
   rather than just "four of five". Lanes run in the order of the list above. */
function weekHabitStrip(){
  const hs=S.habits, n=hs.length||1;
  const cols=lastN(7).map(x=>{
    const rec=S.days[x.ds], done=hs.filter(h=>isHabitDone(h,rec)).length;
    // reversed: the column stacks from the bottom, so habit one lands on top
    // and the lanes read down the column in the same order as the list
    return {d:x.letter, today:x.today, title:`${done} of ${hs.length} done`,
      segs:hs.map(h=>({h:100/n, tone:isHabitDone(h,rec)?"var(--m-fib)":"transparent"})).reverse()};
  });
  return weekChart(cols)+
    `<p class="wknote">One lane per habit, in the order above. Green means done.</p>`;
}

/* ---------- FOODS ---------- */
let foodQuery="", foodCat="All";
/* Chip order is eating order, not the order the list happens to be written in.
   Everyday Indian food first, then the rest of the plate, then what turns up
   occasionally. Anything unlisted falls in at the end. */
const CAT_ORDER=["Dal & Legumes","Vegetables","Breads","Rice & Grains",
  "South Indian","Snacks","Chaat & Street","Non-Veg","Kebabs & Tandoor","Eggs",
  "Dairy & Basics","Yogurt & Bowls","Oats & Porridge","Salads & Sides",
  "Sandwiches & Wraps","Fruits","Avocado","Nuts & Seeds","Sweets","Beverages",
  "Cafe & Bakery","Chinese & Asian","Fast Food & World","Pasta & Italian",
  "Western Breakfast","Soups","Protein & Fitness","My Foods"];
const catRank=c=>{ const i=CAT_ORDER.indexOf(c); return i<0?CAT_ORDER.length:i; };
function viewFoods(){
  const cats=["All",...new Set(allFoods().map(f=>f.cat))].sort((a,b)=>
    a==="All"?-1:b==="All"?1:catRank(a)-catRank(b));
  return header("Foods")+
  `<div class="search"><span class="ic">\u{1F50D}</span>
    <input id="foodSearch" type="search" autocomplete="off" autocorrect="off"

  <div class="cats">${cats.map(c=>
    `<button class="cat${c===foodCat?" on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <section class="card" id="foodResults">${foodResults()}</section>`;
}
/* A word typed the other way round, spelled the other way, or in the other
   language should still land. Each entry maps a word people type to a word the
   list actually uses; a match on either counts, so "cauliflower" finds both
   Cauliflower and Aloo Gobi. */
const ALIAS={
  avacado:"avocado", avacardo:"avocado", avakado:"avocado", abocado:"avocado",
  avocardo:"avocado", butterfruit:"avocado",
  brinjal:"baingan", eggplant:"baingan", aubergine:"baingan", baingan:"brinjal",
  okra:"bhindi", ladyfinger:"bhindi", ladiesfinger:"bhindi",
  cauliflower:"gobi", gobhi:"gobi", peas:"matar", matar:"peas",
  potato:"aloo", aloo:"potato", alu:"aloo", allo:"aloo", aalu:"aloo",
  spinach:"palak", palak:"spinach", fenugreek:"methi",
  cottage:"paneer", curd:"dahi", dahi:"curd", yoghurt:"yogurt", yogurt:"curd",
  chapati:"roti", chappati:"roti", chapathi:"roti", roti:"chapati",
  rice:"chawal", chawal:"rice", lentil:"dal", lentils:"dal", daal:"dal",
  chickpea:"chana", chickpeas:"chana", chana:"chickpea", kabuli:"chana",
  kidneybean:"rajma", rajma:"kidney", bottlegourd:"lauki", lauki:"ghiya",
  ghiya:"lauki", bittergourd:"karela", ridgegourd:"turai", pumpkin:"kaddu",
  jackfruit:"kathal", colocasia:"arbi", yam:"suran", capsicum:"shimla",
  bellpepper:"capsicum", prawn:"shrimp", shrimp:"prawn", mutton:"lamb",
  lamb:"mutton", soybean:"soya", soyabean:"soya", cornflour:"corn",
  buttermilk:"chaas", chaas:"buttermilk", cheela:"chilla", chilla:"cheela",
  sabzi:"curry", sabji:"sabzi", subzi:"sabzi", veggie:"veg",
  sandwhich:"sandwich", sandwitch:"sandwich", chiken:"chicken"
};
// Doubled letters are the commonest slip -- alloo, boilled, brocoli. Squeezing
// every run down to one letter fixes the whole class without a list.
const squeeze=s=>s.replace(/(.)\1+/g,"$1");
/* Every word has to appear somewhere, in any order, across the name, the
   category and the serving. "matar aloo" finds Aloo Matar; "paneer bowl"
   finds the paneer dishes served in one. */
function hits(f,q){
  const words=String(q).trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length) return true;
  const hay=(f.n+" "+f.cat+" "+(f.s||"")).toLowerCase(), flat=squeeze(hay);
  return words.every(w=>hay.includes(w)||flat.includes(squeeze(w))
    ||(ALIAS[w]&&hay.includes(ALIAS[w])));
}
function matches(f){
  return (foodCat==="All"||f.cat===foodCat) && hits(f,foodQuery);
}
/* Most people eat the same twenty dishes. Recent puts them at the top of the
   list and the top of the picker, so the usual breakfast is one tap rather
   than a search through seven hundred. Newest first, one entry per dish. */
function recentFoods(limit){
  const ix=foodIndex(), out=[], seen=new Set();
  const days=Object.keys(S.days).sort().reverse();
  for(const ds of days){
    const meals=(S.days[ds].meals||[]);
    for(let i=meals.length-1;i>=0;i--){
      const key=(meals[i].name||"").toLowerCase();
      if(!key||seen.has(key)) continue;
      seen.add(key);
      const f=ix.byName.get(key);
      if(f!==undefined) out.push(f);
      if(out.length>=limit) return {ix,list:out};
    }
  }
  return {ix,list:out};
}
// One pass over the list per render instead of an indexOf per row: with 700
// foods the old way was a quarter of a million comparisons on every keystroke.
function foodIndex(){
  const all=allFoods(), of=new Map(), byName=new Map();
  all.forEach((f,i)=>{ of.set(f,i); if(!byName.has(f.n.toLowerCase())) byName.set(f.n.toLowerCase(),i); });
  return {all, of, byName};
}
const CAP=120;   // rows drawn at once; the rest wait behind a narrower search
function foodResults(){
  const {all,of}=foodIndex();
  const recent=foodQuery||foodCat!=="All" ? [] : recentFoods(8).list;
  const list=all.filter(matches);
  const groups={};
  list.slice(0,CAP).forEach(f=>{ (groups[f.cat]=groups[f.cat]||[]).push(f); });
  const cats=Object.keys(groups).sort((a,b)=>catRank(a)-catRank(b));
  const head=recent.length
    ? `<div class="cat-h">Recent</div>${recent.map(i=>foodRow(all[i],i)).join("")}` : "";
  const body=list.length
    ? head+cats.map(cat=>
        `<div class="cat-h">${esc(cat)}</div>${groups[cat].map(f=>foodRow(f,of.get(f))).join("")}`).join("")
      +(list.length>CAP?`<div class="empty">${list.length-CAP} more — search to narrow it down</div>`:"")
    : `<div class="empty">Nothing matches "${esc(foodQuery)}". Add it as a custom food below.</div>`;
  return body+`<button class="addfood-link" data-act="add-food">+ Add a custom food</button>`;
}
function foodRow(f,i){
  return `<button class="pick" data-food="${i}">
    <span class="p-em">${esc(f.e||"\u{1F37D}️")}</span>
    <span class="p-b"><span class="p-n">${esc(f.n)}</span>
      <span class="p-s">${esc(f.s)} · P${round(f.p)} C${round(f.c)} F${round(f.f)}</span></span>
    <span class="p-cal">${round(f.cal)}</span><span class="p-add">+</span></button>`;
}

/* ---------- YOU ---------- */
/* ---------- this week ---------- */
/* Fourteen days split down the middle, so every number on the card carries a
   comparison. Averages count only the days that were logged -- a skipped day
   should not read as a day you ate nothing. */
function weekStats(){
  const days=lastN(14);
  const agg=list=>{
    let logged=0,cal=0,p=0,fib=0,water=0,wd=0;
    list.forEach(x=>{
      const rec=S.days[x.ds]; if(!rec) return;
      const meals=rec.meals||[];
      if(meals.length){ const t=sumMeals(meals); logged++; cal+=t.cal; p+=t.p; fib+=t.fib; }
      if(rec.water){ water+=rec.water; wd++; }
    });
    return {logged, cal:logged?cal/logged:0, p:logged?p/logged:0,
      fib:logged?fib/logged:0, water:wd?water/wd:0};
  };
  return {now:agg(days.slice(7)), was:agg(days.slice(0,7))};
}
// The habit with the worst week, for the tip to pick on.
function weakestHabit(){
  if(!S.habits.length) return null;
  const week=lastN(7);
  return S.habits.map(h=>({h,done:week.filter(x=>isHabitDone(h,S.days[x.ds])).length}))
    .sort((a,b)=>a.done-b.done)[0];
}
// Something protein-heavy you already eat beats something protein-heavy you don't.
function proteinPick(){
  const {ix,list}=recentFoods(40);
  const eaten=list.map(i=>ix.all[i]).filter(f=>f.p>=10).sort((a,b)=>b.p-a.p);
  return eaten[0]||ix.all.filter(f=>f.p>=15).sort((a,b)=>b.p-a.p)[0]||null;
}
/* One line, not a list. Ranked, and the first rule that fires wins -- a wall of
   advice gets skimmed past, and being told off is why people delete these apps.
   So: nothing here scolds, and a clean week gets said out loud. */
function weekTip(w){
  const p=S.profile, n=w.now;
  if(!n.logged) return {i:"\u{1F44B}",
    t:"Nothing logged in the last seven days. One meal is enough to pick it back up — everything else is still here."};
  if(n.logged<=2) return {i:"\u{1F331}",
    t:`${n.logged} day${n.logged>1?"s":""} logged this week. Around five is where the averages start telling you something.`};
  if(p.p&&n.p<p.p*.8){
    const pick=proteinPick();
    return {i:"\u{1F4AA}",
      t:`Protein came in about ${round(p.p-n.p)}g short on a typical day.`
        +(pick?` A serving of ${pick.n} is ${round(pick.p)}g of that.`:"")};
  }
  if(p.fib&&n.fib<p.fib*.7) return {i:"\u{1F96C}",
    t:`Fibre averaged ${round(n.fib)}g against a goal of ${p.fib}g. Dal, chana and a piece of fruit are the cheapest way to close it.`};
  if(p.waterGoal&&n.water&&n.water<p.waterGoal*.7) return {i:"\u{1F4A7}",
    t:`Water averaged ${(n.water/1000).toFixed(1)}L against ${(p.waterGoal/1000).toFixed(1)}L. A glass with each meal covers most of the gap.`};
  const weak=weakestHabit();
  if(weak&&weak.done<=2) return {i:weak.h.e||"\u{1F3AF}",
    t:`${weak.h.name} got ticked ${weak.done} of 7 days — the one worth picking on this week.`};
  return {i:"✨",
    t:`Good week — ${n.logged} days logged and nothing off target. Keep it boring.`};
}
function viewWeek(){
  const w=weekStats(), n=w.now, o=w.was, tip=weekTip(w);
  // No comparison to draw until there are two weeks to compare.
  const d=(a,b,dp)=>{
    if(!o.logged||!n.logged) return "";
    const gap=a-b;
    if(Math.abs(gap)<(dp?.05:1)) return `<div class="d">=</div>`;
    return `<div class="d">${gap>0?"▲":"▼"} ${dp?Math.abs(gap).toFixed(1):round(Math.abs(gap))}</div>`;
  };
  const u=`<small style="font-size:11px">`;
  return `<section class="card"><h2>This week</h2>
    <div class="wk-stats">
      <div><div class="v">${round(n.cal)}</div><div class="k">avg kcal</div>${d(n.cal,o.cal)}</div>
      <div><div class="v">${round(n.p)}${u}g</small></div><div class="k">protein</div>${d(n.p,o.p)}</div>
      <div><div class="v">${n.logged}${u}/7</small></div><div class="k">logged</div>${d(n.logged,o.logged)}</div>
      <div><div class="v">${(n.water/1000).toFixed(1)}${u}L</small></div><div class="k">water</div>${d(n.water/1000,o.water/1000,1)}</div>
    </div>
    <div class="wk-tip"><span class="wt-i">${tip.i}</span><span class="wt-t">${esc(tip.t)}</span></div>
  </section>`;
}

/* ====================== TYPE A WHOLE MEAL ======================
   "2 roti, dal, chawal" in the search box turns into three logged dishes.
   Nothing here commits: a parse only ever opens a confirm sheet, which is what
   lets the matching be aggressive without being dangerous. */

// Separators are a convenience, not a syntax -- a line with none of them is
// still walked word by word below.
const SEP=/\s*(?:,|\+|&|\band\b|\baur\b|\n)\s*/;
// Quantity words, Hindi included, because that is how people actually type.
const QTY_WORD={half:.5,aadha:.5,adha:.5,ek:1,one:1,do:2,two:2,teen:3,three:3,
  char:4,chaar:4,four:4};
// Serving words carry no dish, so they come out before matching. Only out of
// the query -- the food list keeps its own wording.
const NOISE=new Set(["a","an","the","of","some","with","bowl","bowls","katori","plate",
  "plates","glass","glasses","cup","cups","piece","pieces","slice","slices",
  "serving","servings","pc","pcs"]);
// For the handful of words that name a whole shelf, the plain version is what
// people mean. Recency still overrides this -- see scoreFood.
const PREFER={rice:"Steamed Rice",chawal:"Steamed Rice",dal:"Dal Tadka",daal:"Dal Tadka",
  roti:"Roti / Chapati",chapati:"Roti / Chapati",chapathi:"Roti / Chapati",
  milk:"Milk (toned)",curd:"Curd / Dahi",dahi:"Curd / Dahi",egg:"Boiled Egg",
  chai:"Masala Chai (w/ sugar)",tea:"Masala Chai (w/ sugar)"};

// Dish name -> how recently it was eaten (0 = most recent). The most useful
// signal there is: everyone eats the same twenty dishes, so "dal" almost
// always means the dal you had last week.
function recentRank(){
  const {ix,list}=recentFoods(40), m=new Map();
  list.forEach((idx,k)=>m.set(ix.all[idx].n.toLowerCase(),k));
  return m;
}
// Does the dish's own name carry every word typed? Stricter than hits(), which
// also searches the category and the serving.
function nameCovers(f,words){
  const name=f.n.toLowerCase(), flat=squeeze(name);
  return words.every(w=>name.includes(w)||flat.includes(squeeze(w))
    ||(ALIAS[w]&&name.includes(ALIAS[w])));
}
function scoreFood(f,phrase,rank){
  const name=f.n.toLowerCase();
  let s=0;
  if(name===phrase) s+=1000;
  else if(name.startsWith(phrase)) s+=120;
  else if(name.includes(phrase)) s+=60;
  if(PREFER[phrase]&&PREFER[phrase].toLowerCase()===name) s+=250;
  const r=rank.get(name);
  if(r!==undefined) s+=400-r*8;          // beats PREFER, loses to an exact name
  return s-Math.min(50,f.n.length);      // a shorter name is a closer fit
}
/* One phrase -> the best dish plus the runners-up, so the confirm sheet can
   offer a swap instead of making you start over. */
function matchPhrase(phrase,ix,rank){
  phrase=(phrase||"").trim();
  // A bare number would otherwise match every "1 bowl (200g)" serving there is.
  if(!phrase||/^[\d.\sx]+$/.test(phrase)) return null;
  const exact=ix.byName.get(phrase);
  if(exact!==undefined) return {food:ix.all[exact],alts:[]};
  const cands=ix.all.filter(f=>hits(f,phrase));
  if(!cands.length) return null;
  cands.sort((a,b)=>scoreFood(b,phrase,rank)-scoreFood(a,phrase,rank));
  return {food:cands[0],alts:cands.slice(1,6)};
}
// Pull a leading (or trailing) quantity off a chunk: "2 roti", "roti x2".
function takeQty(words){
  if(!words.length) return {mult:1,words};
  let m=/^(\d+(?:\.\d+)?)x?$/.exec(words[0]);
  if(m&&words.length>1) return {mult:clamp(+m[1],.05,20),words:words.slice(1)};
  if(QTY_WORD[words[0]]!=null&&words.length>1)
    return {mult:QTY_WORD[words[0]],words:words.slice(1)};
  m=/^x?(\d+(?:\.\d+)?)x?$/.exec(words[words.length-1]);
  if(m&&words.length>1) return {mult:clamp(+m[1],.05,20),words:words.slice(0,-1)};
  return {mult:1,words};
}
/* No separators, so walk the words: longest phrase first, one dish at a time.
   "2 roti dal chawal" -> 2x roti, dal, rice. */
function walkTokens(words,ix,rank,out){
  let i=0;
  while(i<words.length){
    let mult=1,j=i;
    const lead=/^(\d+(?:\.\d+)?)x?$/.exec(words[i]);
    if(lead&&i+1<words.length){ mult=clamp(+lead[1],.05,20); j=i+1; }
    else if(QTY_WORD[words[i]]!=null&&i+1<words.length){ mult=QTY_WORD[words[i]]; j=i+1; }
    let hit=null,took=0;
    for(let len=Math.min(3,words.length-j);len>=1;len--){
      const part=words.slice(j,j+len), m=matchPhrase(part.join(" "),ix,rank);
      // A multi-word phrase only counts if the dish name itself carries every
      // word. Without this, "dal chawal" collapses into whichever dal happens
      // to rank first and the rice is silently lost.
      if(m&&(len===1||nameCovers(m.food,part))){ hit=m; took=len; break; }
    }
    if(hit){ out.push({food:hit.food,mult,alts:hit.alts,raw:words.slice(i,j+took).join(" ")}); i=j+took; }
    else { out.push({miss:words[j]||words[i]}); i=j+1; }
  }
}
/* Returns rows in the order they were typed. A row is either a matched dish or
   a {miss}, which the sheet reports rather than quietly swallowing. */
function parseLine(text,ix){
  const t=String(text||"").trim().toLowerCase(), rows=[];
  if(!t) return {rows};
  ix=ix||foodIndex();
  const rank=recentRank();
  t.split(SEP).filter(Boolean).forEach(chunk=>{
    let words=chunk.split(/\s+/).filter(Boolean);
    const kept=words.filter(w=>!NOISE.has(w));
    if(kept.length) words=kept;          // "1 bowl dal" is dal; "bowl" alone is not
    const q=takeQty(words);
    const whole=q.words.length?matchPhrase(q.words.join(" "),ix,rank):null;
    // A chunk naming one dish outright stays one dish; anything else gets
    // walked, so "dal makhani" survives whole but "roti dal" splits in two.
    if(whole&&nameCovers(whole.food,q.words))
      rows.push({food:whole.food,mult:q.mult,alts:whole.alts,raw:chunk});
    else walkTokens(words,ix,rank,rows);
  });
  return {rows};
}
/* The bar above the search results. Silent until the text reads as 2+ dishes,
   so searching for one thing never sees it. */
function typedBar(q){
  if(!q||!/[,+&]|\s/.test(q.trim())) return "";
  const items=parseLine(q).rows.filter(r=>r.food);
  if(items.length<2) return "";
  const cal=items.reduce((a,r)=>a+r.food.cal*r.mult,0);
  const names=items.map(r=>(r.mult!==1?r.mult+"× ":"")+r.food.n).join(" · ");
  return `<button class="typed-bar" data-act="typed">
    <span class="tb-em">\u{1F37D}️</span>
    <span class="tb-b"><b>Log all ${items.length}</b><span class="tb-s">${esc(names)}</span></span>
    <span class="tb-cal">${round(cal)}</span><span class="p-add">›</span></button>`;
}

/* -- confirm what was read -- */
let batch=null;   // {rows,misses,meal} awaiting confirmation from a typed line
function openBatch(text,meal){
  const {rows}=parseLine(text), items=rows.filter(r=>r.food);
  if(!items.length){ toast("Couldn't read that as a meal"); return; }
  batch={rows:items,misses:rows.filter(r=>r.miss).map(r=>r.miss),meal:meal||pickMeal};
  drawBatch();
}
function drawBatch(){
  if(!batch) return;
  const rows=batch.rows, total=rows.reduce((a,r)=>a+r.food.cal*r.mult,0);
  const list=rows.map((r,i)=>
    `<div class="brow">
      <span class="b-em">${esc(r.food.e||"\u{1F37D}️")}</span>
      <button class="b-b" data-bswap="${i}">
        <span class="b-n">${esc(r.food.n)}</span>
        <span class="b-s">${esc(r.raw)}${r.alts&&r.alts.length?" · tap to change":""}</span>
      </button>
      <div class="bqty"><button data-bmult="${i}:-">−</button><b>${r.mult}×</b><button data-bmult="${i}:+">+</button></div>
      <span class="b-cal">${round(r.food.cal*r.mult)}</span>
      <button class="b-x" data-bdel="${i}">✕</button>
    </div>`).join("");
  const miss=batch.misses.length
    ? `<div class="bmiss">Couldn't find <b>${batch.misses.map(esc).join("</b>, <b>")}</b> —
        search for it, or add it as just calories.</div>` : "";
  openBatchSheet(
    (rows.length?list:`<div class="empty">Nothing left to log.</div>`)+miss+
    `<div class="btotal">Total<span>${round(total)} kcal</span></div>
     <span class="flabel">Which meal</span>
     <div class="meal-pick">${MEALS.map(mm=>
       `<button data-bmp="${mm.k}"${mm.k===batch.meal?' class="on"':""}>
         <span class="em">${mm.e}</span>${esc(mm.l)}</button>`).join("")}</div>
     <button class="btn"${rows.length?"":" disabled"} data-act="confirm-batch">${
       rows.length?`Add ${rows.length} — ${round(total)} kcal to ${esc(mealOf(batch.meal).l)}`
                  :"Nothing to add"}</button>`);
}
function openBatchSheet(body){
  openSheet("Log this meal",
    `<button class="meal-add" data-act="back" style="padding:0 0 8px">‹ Back to list</button>`+body,true);
}
// Tapping a row's name offers the runners-up the parser passed over.
function swapBatch(i){
  if(!batch) return;
  const r=batch.rows[i];
  if(!r) return;
  if(!r.alts||!r.alts.length){ toast(`Only one match for "${r.raw}"`); return; }
  openSheet("Instead of "+r.food.n,
    `<button class="meal-add" data-act="bback" style="padding:0 0 8px">‹ Back</button>`+
    [r.food].concat(r.alts).map((f,k)=>
      `<button class="pick" data-balt="${i}:${k}">
        <span class="p-em">${esc(f.e||"\u{1F37D}️")}</span>
        <span class="p-b"><span class="p-n">${esc(f.n)}</span>
          <span class="p-s">${esc(f.s)} · P${round(f.p)} C${round(f.c)} F${round(f.f)}</span></span>
        <span class="p-cal">${round(f.cal)}</span>
        <span class="p-add">${k===0?"✓":"+"}</span></button>`).join(""),true);
}
function pickAlt(v){
  if(!batch) return;
  const parts=v.split(":"), r=batch.rows[+parts[0]];
  if(!r) return;
  const opts=[r.food].concat(r.alts), chosen=opts[+parts[1]];
  if(chosen){ r.alts=opts.filter(f=>f!==chosen); r.food=chosen; }
  drawBatch();
}
function bumpBatch(v){
  if(!batch) return;
  const parts=v.split(":"), r=batch.rows[+parts[0]];
  if(!r) return;
  r.mult=clamp(+(r.mult+(parts[1]==="+"?.5:-.5)).toFixed(2),.5,10);
  drawBatch();
}
function commitBatch(){
  if(!batch||!batch.rows.length) return;
  const t=day(), meal=batch.meal;
  let cal=0;
  batch.rows.forEach(r=>{
    const item=mkItem(r.food,r.mult,meal);
    t.meals.push(item); cal+=item.cal;
    S.qty[r.food.n.toLowerCase()]=r.mult;   // open here next time, same as one at a time
    // ponytail: one upsert per dish. Batch them if five ever feels slow.
    save({meal:item});
  });
  const n=batch.rows.length;
  batch=null; closeSheet();
  if(TAB!=="today") TAB="today";
  render();
  toast(`Added ${n} item${n>1?"s":""} — ${round(cal)} kcal to ${mealOf(meal).l}`);
}

let quickEdit=null; // the entry the "just calories" sheet is editing, if any
/* Opens for a new log, or for an existing one when `edit` is passed. The
   quantity it starts at is, in order: what this entry already is, what you

function startMult(food,edit){
  if(edit&&food.cal>0) return Math.max(.05,+(edit.cal/food.cal).toFixed(2));
  return S.qty[food.n.toLowerCase()]||1;
}
function openQty(food,meal,from,edit){

    <div class="nutri-prev">

      <div><div class="v num" id="np-p" style="color:var(--m-p)">${round(f.p)}</div><div class="k">Prot</div></div>
      <div><div class="v num" id="np-c" style="color:var(--m-c)">${round(f.c)}</div><div class="k">Carb</div></div>

    </div>

// Patch only what changed - re-rendering the sheet loses scroll position and
// bounces the iOS keyboard.
function syncQty(skipInput){
  if(!pending) return;
  const f=pending.food, m=pending.mult;
  $$("#qseg button").forEach(b=>b.classList.toggle("on",parseFloat(b.dataset.mult)===m));
  $$("#mpick button").forEach(b=>b.classList.toggle("on",b.dataset.mp===pending.meal));
  [["cal","cal"],["p","p"],["c","c"],["f","f"],["fib","fib"]].forEach(([id,k])=>{
    const el=$("#np-"+id); if(el) el.textContent=round(f[k]*m);
  });
  $("#qbtn").textContent=pending.edit
    ? `Save — ${round(f.cal*m)} kcal`
    : `Add ${round(f.cal*m)} kcal to ${mealOf(pending.meal).l}`;
  const ex=$("#qexact");
  if(!skipInput&&ex&&parseFloat(ex.value)!==m) ex.value=m;
}
const newId=()=>"m"+Date.now()+Math.random().toString(36).slice(2,6);
/* The one place a logged row gets built, so the picker, a typed line and an
   edit can never drift apart on ids, macros or the quantity label. */
function mkItem(food,mult,meal,edit){
  const f=food, m=mult;
  return {
    id:edit?edit.id:newId(),            // same id on an edit, so sync updates the row
    name:f.n, e:f.e||"\u{1F37D}️", meal,
    cal:f.cal*m, p:f.p*m, c:f.c*m, f:f.f*m, fib:f.fib*m,
    qtyLabel:(m===1?f.s:`${m}× ${f.s}`)};
}
function commitLog(){
  if(!pending) return;
  const f=pending.food, m=pending.mult, edit=pending.edit;
  const item=mkItem(f,m,pending.meal,edit);
  const t=day(), at=edit?t.meals.findIndex(x=>x.id===edit.id):-1;
  if(at>-1) t.meals[at]=item; else t.meals.push(item);
  S.qty[f.n.toLowerCase()]=m;           // open here next time
  const label=mealOf(pending.meal).l, kcal=round(f.cal*m);
  save({meal:item}); closeSheet();
  if(TAB!=="today"){ TAB="today"; }
  render();
  toast(edit?`Updated — ${kcal} kcal`:`Added ${kcal} kcal to ${label}`);
}

/* ============================ FEEDBACK ============================ */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1900);
}
function celebrate(x,y){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const em=["\u{1F389}","\u{1F525}","⭐","✨","\u{1F44F}"];
  for(let i=0;i<7;i++){
    const s=document.createElement("div");
    s.className="burst"; s.textContent=em[i%em.length];
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.setProperty("--dx",(Math.random()*150-75)+"px");
    s.style.setProperty("--dy",(-55-Math.random()*85)+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000);
  }
}

  if(el('[data-act="back"]')){ openFoodPicker(pickMeal); return; }
  if((n=el("[data-mult]"))){ pending.mult=parseFloat(n.dataset.mult); syncQty(); return; }
  if((n=el("[data-mp]"))){ pending.meal=n.dataset.mp; syncQty(); return; }
  if((n=el("[data-qmp]"))){
    Array.from(n.parentNode.children).forEach(b=>b.classList.toggle("on",b===n)); return; }
  if((n=el("[data-copy]"))){ copyYesterday(n.dataset.copy); return; }
  if((n=el("[data-edit]"))){ editItem(n.dataset.edit); return; }
  if((n=el("[data-quick]"))){ openQuick(n.dataset.quick||pickMeal); return; }
  // A typed line: parse, confirm, then log. Nothing here writes on its own.

  if((n=el("[data-bmult]"))){ bumpBatch(n.dataset.bmult); return; }
  if((n=el("[data-bdel]"))){ if(batch){ batch.rows.splice(+n.dataset.bdel,1); drawBatch(); } return; }
  if((n=el("[data-bswap]"))){ swapBatch(+n.dataset.bswap); return; }
  if((n=el("[data-balt]"))){ pickAlt(n.dataset.balt); return; }
  if(el('[data-act="bback"]')){ drawBatch(); return; }
  if((n=el("[data-bmp]"))){ if(batch){ batch.meal=n.dataset.bmp; drawBatch(); } return; }
  if(el('[data-act="confirm-batch"]')){ commitBatch(); return; }
  if(el('[data-act="save-quick"]')){ saveQuick(); return; }
  if(el('[data-act="confirm-log"]')){ commitLog(); return; }
  if(el('[data-act="add-food"]')){ openAddFood(); return; }
  if(el('[data-act="save-food"]')){ saveCustomFood(); return; }

  // Every tick lands on the day the stepper is showing, not on today.
  if((n=el("[data-hday]"))){
    const d=new Date(habitDate+"T00:00:00");
    d.setDate(d.getDate()+Number(n.dataset.hday));
    const ds=d.toLocaleDateString("en-CA");
    if(ds<=todayStr()) habitDate=ds;       // no ticking a day that has not happened
    render(); return; }
  if((n=el("[data-hcheck]"))){

  if((n=el("[data-hplus]"))){

  if((n=el("[data-hminus]"))){
