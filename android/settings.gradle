// The Android wrapper is a Trusted Web Activity: it ships no UI of its own and
// renders https://prasangr.github.io/NourishMeBro1/ in a Chrome that has no
// address bar. The web app stays the single source of truth -- shipping a fix
// still means pushing index.html, not a Play release.
pluginManagement{ repositories{ google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement{ repositories{ google(); mavenCentral() } }
rootProject.name="NourishMeBro"
include ":app"
